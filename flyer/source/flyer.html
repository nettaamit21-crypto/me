<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>פלייר – הנגרייה בחוות רום</title>
<style>
  @font-face { font-family: 'Frank Ruhl Libre'; src: url('fonts/FrankRuhlLibre-900-hebrew.woff2') format('woff2'); font-weight: 300 900; unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
  @font-face { font-family: 'Frank Ruhl Libre'; src: url('fonts/FrankRuhlLibre-900-latin.woff2') format('woff2'); font-weight: 300 900; }
  @font-face { font-family: 'Heebo'; src: url('fonts/Heebo-400-hebrew.woff2') format('woff2'); font-weight: 100 900; unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
  @font-face { font-family: 'Heebo'; src: url('fonts/Heebo-400-latin.woff2') format('woff2'); font-weight: 100 900; }
  @page { size: 148mm 210mm; margin: 0; }
  :root { --walnut: #2A1F17; --oak: #8A5A2E; --ink: #3A2E25; }
  html, body { margin: 0; padding: 0; background: #fff; }
  .page { position: relative; width: 148mm; height: 210mm; overflow: hidden; }
  .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .wash-top { position: absolute; left: 0; top: 0; width: 100%; height: 75mm;
    background: linear-gradient(to bottom, rgba(252,250,247,.55) 0, rgba(252,250,247,.35) 55%, rgba(252,250,247,0) 100%); }
  .wash-bottom { position: absolute; left: 0; bottom: 0; width: 100%; height: 30mm;
    background: linear-gradient(to top, rgba(250,248,245,.92) 0, rgba(250,248,245,.75) 45%, rgba(250,248,245,0) 100%); }
  .top { position: absolute; top: 11mm; right: 42mm; left: 9mm; color: var(--walnut); }
  .hello { font: 500 8.6pt/1.3 'Heebo', sans-serif; color: var(--oak); letter-spacing: .03em; margin: 0 0 3.2mm; }
  h1 { font-family: 'Frank Ruhl Libre', serif; font-weight: 800; font-size: 31pt; line-height: 1.02; margin: 0; letter-spacing: -.005em; }
  .body { font: 400 10pt/1.5 'Heebo', sans-serif; color: var(--ink); margin: 4mm 0 0; }
  .body.second { margin-top: 1.6mm; }
  .contact { position: absolute; bottom: 8.5mm; right: 9mm; color: var(--walnut); text-align: right; }
  .contact .label { font: 500 9pt/1.3 'Heebo', sans-serif; color: var(--oak); letter-spacing: .02em; }
  .contact .phone { direction: ltr; unicode-bidi: isolate; font: 700 19pt/1.15 'Heebo', sans-serif; letter-spacing: .01em; }
  .contact .place { font: 400 7.2pt/1.4 'Heebo', sans-serif; color: var(--oak); margin-top: .6mm; }
  .contact .name { font-weight: 700; font-size: 11pt; color: var(--walnut); letter-spacing: 0; }
  .ltr { direction: ltr; unicode-bidi: isolate; }
  .inset { position: absolute; left: 5mm; bottom: 9.5mm; width: 44mm; margin: 0; background: #fff; padding: 1.3mm 1.3mm 0;
    transform: rotate(-2.5deg); box-shadow: 0 .5mm 2.2mm rgba(42,31,23,.28); }
  .inset img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
  .inset figcaption { font: 400 6.4pt/1 'Heebo', sans-serif; color: var(--oak); text-align: center; padding: 1.3mm 0 1.5mm; }
</style>
</head>
<body>
  <div class="page">
    <img class="photo" src="cars_a5.jpg" alt="מכוניות עץ צבעוניות בשורה על שולחן העבודה בנגרייה">
    <div class="wash-top"></div>
    <div class="wash-bottom"></div>
    <div class="top">
      <p class="hello">שלום לכל הקהילה ולאורחים על ההר</p>
      <h1>הנגרייה<br>בחוות רום</h1>
      <p class="body">פותחת את שעריה לקהל הרחב, ומציעה מגוון<br>של סדנאות לזוגות, למשפחות ולקבוצות.</p>
      <p class="body second">בונים בידיים מתנות וצעצועים לילדים.</p>
    </div>
    <figure class="inset">
      <img src="view.jpg" alt="הנוף מהנגרייה: שתי אדניות עץ והר כמון">
      <figcaption>הנוף מהנגרייה</figcaption>
    </figure>
    <div class="contact">
      <div class="label"><span class="name">נטע עמית</span> · לפרטים והרשמה</div>
      <div class="phone">052-8666104</div>
      <div class="place">חוות רום · הר כמון, הגליל · <span class="ltr">havatrom.co.il</span></div>
    </div>
  </div>
</body>
</html>
