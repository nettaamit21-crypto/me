<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>פלייר – הנגרייה בחוות רום</title>
<style>
  @font-face { font-family: 'Frank Ruhl Libre'; src: url('fonts/FrankRuhlLibre-900-hebrew.woff2') format('woff2'); font-weight: 300 900; unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
  @font-face { font-family: 'Frank Ruhl Libre'; src: url('fonts/FrankRuhlLibre-900-latin.woff2') format('woff2'); font-weight: 300 900; }
  @font-face { font-family: 'Heebo'; src: url('fonts/Heebo-400-hebrew.woff2') format('woff2'); font-weight: 100 900; unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
  @font-face { font-family: 'Heebo'; src: url('fonts/Heebo-400-latin.woff2') format('woff2'); font-weight: 100 900; }
  @page { size: 148mm 210mm; margin: 0; }
  :root { --paper: #F3EDE3; --walnut: #2A1F17; --oak: #8A5A2E; --ink: #3A2E25; --line: #CDBBA2; }
  html, body { margin: 0; padding: 0; background: var(--paper); }
  .page { position: relative; width: 148mm; height: 210mm; overflow: hidden; background: var(--paper); }
  .grain { position: absolute; inset: 0; opacity: .5; mix-blend-mode: multiply; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .35  0 0 0 .08 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .hero { position: absolute; top: 0; left: 0; width: 148mm; height: 110mm; object-fit: cover; }
  .print { position: absolute; left: 8mm; top: 86mm; width: 37mm; margin: 0; background: #fff; padding: 1.4mm 1.4mm 0;
    transform: rotate(-3deg); box-shadow: 0 .6mm 2.4mm rgba(42,31,23,.3); }
  .print img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; }
  .print figcaption { font: 400 6.4pt/1 'Heebo', sans-serif; color: var(--oak); text-align: center; padding: 1.4mm 0 1.6mm; }
  .head { position: absolute; top: 115mm; right: 10mm; left: 52mm; }
  .hello { font: 500 8.4pt/1.3 'Heebo', sans-serif; color: var(--oak); letter-spacing: .03em; margin: 0 0 1.6mm; }
  h1 { font-family: 'Frank Ruhl Libre', serif; font-weight: 800; font-size: 28pt; line-height: 1; margin: 0; color: var(--walnut); }
  .open { font: 500 10.4pt/1.3 'Heebo', sans-serif; color: var(--ink); margin: 1.8mm 0 0; }
  .hook { position: absolute; top: 144mm; right: 10mm; left: 10mm; margin: 0;
    font-family: 'Frank Ruhl Libre', serif; font-weight: 700; font-size: 22pt; line-height: 1.15; color: var(--oak); }
  .body { position: absolute; top: 158.5mm; right: 10mm; left: 10mm; margin: 0; font: 400 9.8pt/1.55 'Heebo', sans-serif; color: var(--ink); }
  .rule { position: absolute; top: 178mm; right: 10mm; left: 10mm; height: 0; border-top: .3mm solid var(--line); }
  .contact { position: absolute; top: 182mm; right: 10mm; color: var(--walnut); }
  .contact .label { font: 400 9pt/1.3 'Heebo', sans-serif; color: var(--oak); }
  .contact .name { font-weight: 700; font-size: 11pt; color: var(--walnut); }
  .contact .phone { direction: ltr; unicode-bidi: isolate; font: 700 21pt/1.15 'Heebo', sans-serif; letter-spacing: .01em; }
  .place { position: absolute; top: 189.5mm; left: 10mm; text-align: left; font: 400 7.6pt/1.5 'Heebo', sans-serif; color: var(--oak); }
  .ltr { direction: ltr; unicode-bidi: isolate; }
</style>
</head>
<body>
  <div class="page">
    <img class="hero" src="hero.jpg" alt="זוג עובד יחד בנגרייה: מסור, מלטשת וצעצועי עץ על השולחן">
    <figure class="print">
      <img src="cars.jpg" alt="מכוניות עץ צבעוניות בשורה">
      <figcaption>מכוניות עץ מהסדנה</figcaption>
    </figure>
    <div class="head">
      <p class="hello">שלום לכל הקהילה ולאורחים על ההר</p>
      <h1>הנגרייה בחוות רום</h1>
      <p class="open">פותחת את שעריה לקהל הרחב</p>
    </div>
    <p class="hook">הצעצוע לילדים. החוויה – בשבילכם.</p>
    <p class="body">ריח של נסורת, נוף של הר כמון, וזמן שקט לעבוד בידיים.<br>סדנאות לזוגות, למשפחות ולקבוצות, בלי שום ניסיון.</p>
    <div class="rule"></div>
    <div class="contact">
      <div class="label"><span class="name">נטע עמית</span> · לפרטים והרשמה</div>
      <div class="phone">052-8666104</div>
    </div>
    <div class="place">חוות רום · הר כמון, הגליל<br><span class="ltr">havatrom.co.il</span></div>
    <div class="grain"></div>
  </div>
</body>
</html>
