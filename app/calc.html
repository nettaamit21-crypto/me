<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>מחשבון הצעות הנגרייה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Heebo:wght@300;400;500;600;700&display=swap">
<style>
  :root {
    /* Layout: a workbench — the size controls sit beside a drawing board on graph paper; the running price is pinned to the bottom edge like a tally strip */
    --paper: #F4EEE5;
    --surface: #FFFCF7;
    --surface-2: #F1E8DB;
    --sunk: #ECE3D5;
    --ink: #241B14;
    --muted: #6B5A4B;
    --faint: #9A8977;
    --line: rgba(42, 31, 23, .13);
    --line-2: rgba(42, 31, 23, .26);
    --oak: #9A6535;
    --oak-2: #81512A;
    --on-oak: #FFF9F1;
    --brass: #B8874A;
    --walnut: #2A1F17;
    --on-walnut: #F3EDE3;
    --on-walnut-2: #C9B79E;
    --walnut-accent: #E7C796;
    --walnut-warn: #F2A88F;
    --board: #FBF8F2;
    --grid: rgba(154, 101, 53, .08);
    --grid-2: rgba(154, 101, 53, .15);
    --ok: #3D7A4C;
    --ok-bg: rgba(61, 122, 76, .11);
    --warn: #8E5A0C;
    --warn-bg: rgba(198, 135, 30, .14);
    --bad: #AE3E2A;
    --bad-bg: rgba(174, 62, 42, .10);
    --scrim: rgba(20, 14, 10, .45);
    --split-cost: #CDB89A;
    --split-fixed: #A3958A;
    --split-out: #B8874A;
    --split-profit: #3D7A4C;
    --shadow: 0 1px 2px rgba(42, 31, 23, .06), 0 10px 28px -16px rgba(42, 31, 23, .30);

    --display: "Frank Ruhl Libre", "David Libre", "Times New Roman", serif;
    --ui: "Heebo", "Assistant", "Arial Hebrew", Arial, sans-serif;
    --radius: 8px;
    --gutter: clamp(16px, 3vw, 32px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #18120E; --surface: #221A14; --surface-2: #2B2119; --sunk: #1C1511;
      --ink: #F1E9DC; --muted: #BCA991; --faint: #8C7B68;
      --line: rgba(241, 233, 220, .11); --line-2: rgba(241, 233, 220, .22);
      --oak: #D49F5C; --oak-2: #E2B273; --on-oak: #1B140F; --brass: #C99561;
      --walnut: #0E0A07; --on-walnut: #F1E9DC; --on-walnut-2: #B8A58C; --walnut-accent: #E7C796; --walnut-warn: #F2A88F;
      --board: #1E1712; --grid: rgba(212, 159, 92, .06); --grid-2: rgba(212, 159, 92, .12);
      --ok: #82C094; --ok-bg: rgba(130, 192, 148, .12); --warn: #E6AE52; --warn-bg: rgba(230, 174, 82, .13);
      --bad: #EE8A72; --bad-bg: rgba(238, 138, 114, .12); --scrim: rgba(0, 0, 0, .6);
      --split-cost: #5E4D3C; --split-fixed: #75685C; --split-out: #C99561; --split-profit: #82C094;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px -14px rgba(0, 0, 0, .6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #18120E; --surface: #221A14; --surface-2: #2B2119; --sunk: #1C1511;
    --ink: #F1E9DC; --muted: #BCA991; --faint: #8C7B68;
    --line: rgba(241, 233, 220, .11); --line-2: rgba(241, 233, 220, .22);
    --oak: #D49F5C; --oak-2: #E2B273; --on-oak: #1B140F; --brass: #C99561;
    --walnut: #0E0A07; --on-walnut: #F1E9DC; --on-walnut-2: #B8A58C; --walnut-accent: #E7C796; --walnut-warn: #F2A88F;
    --board: #1E1712; --grid: rgba(212, 159, 92, .06); --grid-2: rgba(212, 159, 92, .12);
    --ok: #82C094; --ok-bg: rgba(130, 192, 148, .12); --warn: #E6AE52; --warn-bg: rgba(230, 174, 82, .13);
    --bad: #EE8A72; --bad-bg: rgba(238, 138, 114, .12); --scrim: rgba(0, 0, 0, .6);
      --split-cost: #5E4D3C; --split-fixed: #75685C; --split-out: #C99561; --split-profit: #82C094;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px -14px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--ui); font-size: 15px; line-height: 1.55; font-weight: 400;
    direction: rtl; -webkit-font-smoothing: antialiased;
    padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  img { max-width: 100%; }
  h1, h2, h3, h4 { margin: 0; font-weight: 500; text-wrap: balance; }
  p { margin: 0; }
  .wrap { max-width: 1280px; margin-inline: auto; padding-inline: var(--gutter); }
  .ltr { direction: ltr; unicode-bidi: isolate; }
  .num { font-variant-numeric: tabular-nums; }
  .mut { color: var(--muted); font-weight: 400; }
  .boot { padding: 48px 24px; text-align: center; color: var(--muted); }
  :focus-visible { outline: 2px solid var(--oak); outline-offset: 2px; }
  input[type="checkbox"], input[type="radio"] { accent-color: var(--oak); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

  /* ---------- header & tabs ---------- */
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); border-bottom: 1px solid var(--line); }
  .top-row { display: flex; align-items: center; justify-content: space-between; gap: 8px 14px; min-height: 56px; flex-wrap: wrap; padding-block: 6px; }
  .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .brand-name { font-family: var(--display); font-size: 1.45rem; font-weight: 500; letter-spacing: .02em; }
  .brand-sub { font-size: .8rem; color: var(--muted); letter-spacing: .03em; }
  .top-actions { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .sync { font-size: .74rem; color: var(--faint); display: inline-flex; align-items: center; gap: 6px; margin-inline-end: 6px; white-space: nowrap; }
  .sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .sync.ok::before { background: var(--ok); }
  .sync.busy::before { background: var(--brass); }
  .sync.err::before { background: var(--bad); }
  .tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { appearance: none; border: 0; background: none; padding: 9px 14px 10px; font-size: .92rem; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .tab:hover { color: var(--ink); }
  .tab.on { color: var(--ink); border-bottom-color: var(--oak); font-weight: 500; }
  .tab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--bad); }
  @media (max-width: 700px) { .top { position: static; } .top-actions .btn { padding: 4px 7px; } .brand-name { font-size: 1.3rem; } }

  /* ---------- buttons ---------- */
  .btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 7px 12px; font-size: .88rem; font-weight: 500; cursor: pointer; line-height: 1.2; white-space: nowrap; }
  .btn:hover { border-color: var(--oak); color: var(--oak); }
  .btn.primary { background: var(--oak); border-color: var(--oak); color: var(--on-oak); }
  .btn.primary:hover { background: var(--oak-2); border-color: var(--oak-2); color: var(--on-oak); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
  .btn.sm { padding: 5px 10px; font-size: .82rem; }
  .btn.danger { color: var(--bad); }
  .btn.danger:hover { border-color: var(--bad); color: var(--bad); }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  .btn .badge { background: var(--surface-2); color: var(--muted); border-radius: 10px; padding: 0 6px; font-size: .72rem; font-weight: 500; }
  .linkbtn { appearance: none; background: none; border: 0; padding: 0; color: var(--oak); cursor: pointer; font-size: .85rem; text-decoration: underline; text-underline-offset: 3px; }
  .ibtn { appearance: none; border: 0; background: transparent; width: 30px; height: 30px; border-radius: 5px; cursor: pointer; color: var(--muted); display: inline-grid; place-items: center; flex: none; }
  .ibtn:hover { background: var(--surface-2); color: var(--ink); }
  .ibtn.on { color: var(--oak); background: var(--surface-2); }
  .ibtn.del:hover { color: var(--bad); }
  .ibtn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- layout ---------- */
  .main { display: flex; flex-direction: column; gap: 16px; padding-block: 18px 28px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .h-sec { font-family: var(--display); font-size: 1.25rem; font-weight: 500; }
  .h-min { font-size: .9rem; font-weight: 600; margin: 14px 0 6px; }
  .eyebrow { font-size: .72rem; letter-spacing: .1em; color: var(--oak); font-weight: 500; }
  .sub { color: var(--muted); font-size: .86rem; margin-top: 4px; max-width: 70ch; }
  .note { font-size: .82rem; color: var(--muted); }
  .hint { font-size: .78rem; color: var(--faint); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; }
  .gap { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .banner { display: flex; gap: 10px 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--warn-bg); border: 1px solid color-mix(in srgb, var(--warn) 28%, transparent); border-radius: var(--radius); padding: 10px 14px; font-size: .88rem; }
  .warnbox { background: var(--bad-bg); border: 1px solid color-mix(in srgb, var(--bad) 28%, transparent); border-radius: 6px; padding: 10px 12px; font-size: .86rem; display: flex; flex-direction: column; gap: 6px; }
  .okbox { background: var(--ok-bg); border-radius: 6px; padding: 10px 12px; font-size: .86rem; }
  .pill { display: inline-flex; align-items: center; font-size: .68rem; padding: 1px 7px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); font-weight: 600; white-space: nowrap; vertical-align: middle; }
  .bad-t { color: var(--bad); }

  /* ---------- quote head & item strip ---------- */
  .qhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; }
  .qtitle { display: flex; flex-direction: column; gap: 2px; flex: 1 1 320px; min-width: 0; }
  .title-in { border: 0; border-bottom: 1px dashed var(--line-2); background: transparent; font-family: var(--display); font-size: clamp(1.35rem, 3vw, 1.85rem); padding: 2px 0; width: 100%; color: var(--ink); }
  .title-in:focus { outline: none; border-bottom-color: var(--oak); }
  .strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  .ichip { appearance: none; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; padding: 8px 12px; cursor: pointer; text-align: right; min-width: 150px; max-width: 240px; flex: none; }
  .ichip .n { font-weight: 500; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .ichip .m { font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ichip.on { border-color: var(--oak); box-shadow: inset 0 0 0 1px var(--oak); background: color-mix(in srgb, var(--oak) 7%, var(--surface)); }
  .ichip.add { border-style: dashed; color: var(--oak); justify-content: center; align-items: center; min-width: 120px; font-weight: 500; }

  /* ---------- design tab ---------- */
  .design { display: grid; grid-template-columns: minmax(290px, 370px) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 900px) { .design { grid-template-columns: minmax(0, 1fr); } .design .boardcol { order: -1; } }
  .config { display: flex; flex-direction: column; gap: 14px; }
  .item-name { width: 100%; border: 0; border-bottom: 1px solid var(--line-2); background: transparent; font-family: var(--display); font-size: 1.3rem; padding: 2px 0; }
  .item-name:focus { outline: none; border-bottom-color: var(--oak); }
  .lbl { font-size: .86rem; color: var(--muted); }
  .sec-title { font-size: .76rem; letter-spacing: .1em; color: var(--oak); font-weight: 600; padding-top: 12px; border-top: 1px solid var(--line); }
  .stepper, .valbox { display: inline-flex; align-items: center; border: 1px solid var(--line-2); border-radius: 6px; overflow: hidden; background: var(--surface); flex: none; }
  .stepper button, .valbox button { appearance: none; border: 0; background: var(--surface-2); width: 30px; height: 30px; font-size: 1rem; cursor: pointer; color: var(--ink); }
  .stepper button:hover, .valbox button:hover { background: var(--sunk); }
  .stepper input, .valbox input { width: 56px; border: 0; text-align: center; background: transparent; height: 30px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .valbox .u { font-size: .74rem; color: var(--muted); padding-inline: 0 6px; }
  .pc { display: flex; flex-direction: column; gap: 6px; }
  .pc-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .pc-label { font-weight: 500; font-size: .92rem; }
  .pc-hint { display: block; font-size: .74rem; color: var(--faint); font-weight: 400; }
  .pc-scale { display: flex; justify-content: space-between; font-size: .72rem; color: var(--faint); direction: ltr; font-variant-numeric: tabular-nums; }
  .range { -webkit-appearance: none; appearance: none; width: 100%; height: 24px; background: transparent; direction: ltr; margin: 0; cursor: pointer; }
  .range::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--oak) var(--pct, 50%), var(--line-2) var(--pct, 50%)); }
  .range::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line-2); }
  .range::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--oak); }
  .range::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); border: 2px solid var(--oak); margin-top: -8px; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
  .range::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--surface); border: 2px solid var(--oak); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { appearance: none; border: 1px solid var(--line-2); background: var(--surface); border-radius: 16px; padding: 5px 12px; font-size: .85rem; cursor: pointer; font-variant-numeric: tabular-nums; }
  .chip:hover { border-color: var(--oak); }
  .chip.on { background: var(--oak); border-color: var(--oak); color: var(--on-oak); }
  .fixed-list { display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: .78rem; color: var(--muted); }
  .unitprice { display: flex; align-items: baseline; justify-content: space-between; gap: 4px 10px; flex-wrap: wrap; padding: 10px 12px; border-radius: 6px; background: var(--surface-2); }
  .unitprice b { font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .unitprice small { color: var(--muted); font-size: .78rem; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; }

  .boardcol { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .board { position: relative; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background-color: var(--board);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px), linear-gradient(var(--grid-2) 1px, transparent 1px), linear-gradient(90deg, var(--grid-2) 1px, transparent 1px);
    background-size: 16px 16px, 16px 16px, 80px 80px, 80px 80px; }
  .board-canvas { width: 100%; aspect-ratio: 16 / 11; max-height: min(64vh, 580px); min-height: 250px; }
  .v3d { position: relative; width: 100%; height: 100%; }
  .v3d canvas { display: block; width: 100%; height: 100%; }
  .v3d-labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .v3d-lab { position: absolute; left: 0; top: 0; font-size: .78rem; font-weight: 600; color: var(--ink); background: color-mix(in srgb, var(--board) 86%, transparent); padding: 0 6px; border-radius: 4px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .board-photo { display: block; width: 100%; aspect-ratio: 16 / 11; max-height: min(64vh, 580px); object-fit: contain; background: var(--board); }
  .board-note { position: absolute; inset-inline-start: 10px; top: 10px; max-width: calc(100% - 20px); font-size: .78rem; color: var(--muted); background: color-mix(in srgb, var(--board) 90%, transparent); padding: 3px 8px; border-radius: 4px; pointer-events: none; }
  .board-sel { position: absolute; inset-inline-start: 10px; bottom: 10px; max-width: calc(100% - 20px); font-size: .8rem; background: var(--surface); border: 1px solid var(--oak); color: var(--ink); padding: 3px 9px; border-radius: 4px; pointer-events: none; }
  .board-empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); font-size: .9rem; pointer-events: none; }
  .board-tools { display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 6px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
  .seg button { appearance: none; border: 0; background: transparent; padding: 5px 10px; font-size: .8rem; cursor: pointer; color: var(--muted); border-inline-start: 1px solid var(--line); }
  .seg button:first-child { border-inline-start: 0; }
  .seg button:hover { color: var(--ink); }
  .seg button.on { background: var(--surface-2); color: var(--ink); font-weight: 500; }
  .board.building { border-color: var(--oak); box-shadow: inset 0 0 0 1px var(--oak); }
  .board.building .board-canvas { max-height: min(52vh, 480px); }
  @media (max-width: 900px) {
    .board.building { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; }
    .board.building .board-canvas { max-height: 36vh; min-height: 190px; }
  }
  .v3d-move { position: absolute; top: 10px; inset-inline-end: 10px; background: var(--ink); color: var(--paper); padding: 3px 10px; border-radius: 12px; font-size: .8rem; pointer-events: none; font-variant-numeric: tabular-nums; }
  .build { border: 1px solid var(--oak); border-radius: var(--radius); background: var(--surface); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .build-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .build-head b { font-size: .98rem; font-weight: 600; }
  .build-steps { margin: 0; padding-inline-start: 22px; font-size: .88rem; color: var(--muted); display: flex; flex-direction: column; gap: 5px; }
  .build-steps b { color: var(--ink); font-weight: 600; }
  .build-row { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .build-row > .lbl { min-width: 54px; }
  .build-row .f .cell { width: 80px; }
  .build .state { font-weight: 500; font-size: .88rem; }
  .pads { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .pad { display: inline-flex; gap: 4px; }
  .pad .btn { min-width: 76px; }
  .unplaced { display: flex; flex-direction: column; gap: 2px; border-top: 1px solid var(--line); padding-top: 8px; }
  .unplaced .row { padding: 4px 0; border-bottom: 1px dashed var(--line); font-size: .86rem; }
  .unplaced .row > span { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .photo-strip { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .pthumb { appearance: none; position: relative; flex: none; width: 72px; height: 54px; padding: 0; border: 2px solid transparent; border-radius: 6px; overflow: hidden; background: var(--sunk); cursor: pointer; color: var(--muted); }
  .pthumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pthumb.on { border-color: var(--oak); }
  .pthumb.add { border: 1px dashed var(--oak); color: var(--oak); font-size: .82rem; font-weight: 500; display: grid; place-items: center; background: transparent; }
  .pstar { position: absolute; bottom: 2px; inset-inline-start: 2px; background: var(--oak); color: var(--on-oak); font-size: .6rem; line-height: 1.5; padding: 0 4px; border-radius: 3px; }
  .photo-strip .actions { margin-inline-start: auto; }
  .dimsline { font-size: .86rem; color: var(--muted); }
  .dimsline b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

  function groupedCuts(E, Q) {

    trash: function () { return html`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>`; },
    close: function () { return html`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>`; },
    link: function () { return html`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>`; },
    relink: function () { return html`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg>`; }
  };
  var TABS = [
    { id: 'design', label: 'תכנון ושרטוט' },
    { id: 'wood', label: 'מחירון ועץ' },
    { id: 'costs', label: 'עלויות ורווח' },
    { id: 'quote', label: 'הצעה ללקוח' },
    { id: 'shop', label: 'דף עבודה' }
  ];
  function syncInfo() {
    if (EMBED) return ['ok', 'נשמר בפנקס'];
    switch (Cloud.state) {
      case 'synced': return ['ok', 'מסונכרן לחשבון שלך'];
      case 'syncing': return ['busy', 'מסנכרן…'];
      case 'error': return ['err', 'הסנכרון נכשל · נשמר במכשיר'];
      case 'full': return ['err', 'האחסון בחשבון מלא · נשמר במכשיר'];
      case 'device': return ['', 'נשמר במכשיר הזה'];
      default: return ['', 'נשמר בדפדפן הזה'];
    }
  }

  function Header(props) {
    var C = props.C, si = syncInfo();
    var warn = C.wood.missingN > 0 || C.wood.tooLong > 0;
    return html`<header class="top">
      <div class="wrap top-row">
        <div class="brand"><span class="brand-name">${S.settings.biz.name || 'הנגרייה'}</span><span class="brand-sub">מחשבון הצעות מחיר</span></div>
        <div class="top-actions">
          <span class=${'sync ' + si[0]}>${si[1]}</span>
          ${EMBED ? null : html`<button class="btn ghost sm" onClick=${function () { openModal({ type: 'saved' }); }}>הצעות שמורות ${S.saved.length ? html`<span class="badge">${S.saved.length}</span>` : null}</button>`}
          ${EMBED ? null : html`<button class="btn ghost sm" onClick=${saveCurrent}>שמירה</button>`}
          ${EMBED ? null : html`<button class="btn ghost sm" onClick=${startNewQuote}>הצעה חדשה</button>`}
          <button class="btn ghost sm" onClick=${function () { openModal({ type: 'backup' }); }}>גיבוי</button>
          ${EMBED ? html`<button class="btn primary sm" id="nq-back" onClick=${embedDone}>✓ חזרה להזמנה</button>` : null}
        </div>
      </div>
      <nav class="wrap tabs" aria-label="שלבי ההצעה">
        ${TABS.map(function (t) {
          return html`<button class=${'tab' + (S.ui.tab === t.id ? ' on' : '')} aria-current=${S.ui.tab === t.id ? 'page' : null} onClick=${function () { setTab(t.id); }}>${t.label}${t.id === 'wood' && warn ? html`<span class="dot" title="יש חלקים בלי מחיר"></span>` : null}</button>`;
        })}
      </nav>
    </header>`;
  }

  function Stepper(props) {
    var v = props.value;
    return html`<div class="stepper">
      <button type="button" aria-label="פחות" onClick=${function () { props.onChange(String(Math.max(props.min || 0, Math.round(num(v)) - 1))); }}>−</button>
      <input id=${props.id} inputmode="numeric" aria-label=${props.label} value=${v} onInput=${function (e) { props.onChange(e.target.value); }}/>
      <button type="button" aria-label="יותר" onClick=${function () { props.onChange(String(Math.round(num(v)) + 1)); }}>+</button>
    </div>`;
  }

  function ParamControl(props) {
    var p = props.p, item = props.item, v = num(p.value);
    var id = 'pc-' + item.id + '-' + p.key;
    if (p.type === 'choice') {
      return html`<div class="pc">
        <div class="pc-head"><span class="pc-label">${p.label}${p.hint ? html`<span class="pc-hint">${p.hint}</span>` : null}</span></div>
        <div class="chips" role="group" aria-label=${p.label}>
          ${(p.options || []).map(function (o) {
            var on = num(o.v) === v;
            return html`<button type="button" class=${'chip' + (on ? ' on' : '')} aria-pressed=${on} onClick=${function () { p.value = num(o.v); commit('current'); }}>${o.label != null ? o.label : o.v}</button>`;
          })}
        </div>
      </div>`;
    }
    var min = num(p.min), max = num(p.max), step = num(p.step) || 1;
    function set(x) { p.value = Math.round(clamp(x, min, max) / step) * step; p.value = Math.round(p.value * 1000) / 1000; commit('current'); }
    var pct = max > min ? (clamp(v, min, max) - min) / (max - min) * 100 : 0;
    return html`<div class="pc">
      <div class="pc-head">
        <label class="pc-label" for=${id}>${p.label}${p.hint ? html`<span class="pc-hint">${p.hint}</span>` : null}</label>
        <div class="valbox">
          <button type="button" aria-label=${'להקטין ' + p.label} onClick=${function () { set(v - step); }}>−</button>
          <input aria-label=${p.label} inputmode="decimal" value=${fmtDim(v)} onChange=${function (e) { set(num(e.target.value)); }}/>
          ${p.unit ? html`<span class="u">${p.unit}</span>` : null}
          <button type="button" aria-label=${'להגדיל ' + p.label} onClick=${function () { set(v + step); }}>+</button>
        </div>
      </div>
      <input id=${id} class="range" type="range" min=${min} max=${max} step=${step} value=${v} style=${'--pct:' + pct + '%'} onInput=${function (e) { p.value = num(e.target.value); commit('current'); }}/>
      <div class="pc-scale"><span>${fmtDim(min)}</span><span>${fmtDim(max)}</span></div>
    </div>`;
  }

  function Viewer3D(props) {
    var item = props.item, E = props.E;
    var host = useRef(null), V = mainViewer();
    var build = !!S.ui.build;
    var photos = itemPhotos(item);
    var curId = photos.indexOf(S.ui.photoSel) >= 0 ? S.ui.photoSel : (item.photo || photos[0] || null);
    var photo = curId ? getImage(curId) : null;
    var showPhoto = S.ui.photo && photos.length > 0 && !build;
    var morePhotos = useRef(null);
    var list = build ? E.placedBoxes : E.boxes, layout = !build && E.layout;
    if (V) {
      V.onPick = function (pid) { S.ui.selPart = pid; FORCE(); };
      V.onMoveEnd = function (pid, d) { movePart(item, pid, d); };
    }
    useEffect(function () {
      if (V && host.current) { host.current.appendChild(V.el); V.w = 0; V.resize(); }
      return function () { if (V && V.el.parentNode) V.el.parentNode.removeChild(V.el); };
    }, []);
    useEffect(function () { if (V) V.setBuild(build); }, [build]);
    var sig = item.id + '|' + (build ? 'B' : 'V') + '|' + boxesSig(list, S.ui.vivid);
    useEffect(function () {
      if (!V) return;
      var reset = V.lastItem !== item.id;
      V.lastItem = item.id;
      V.showDims = S.ui.dims && !layout;
      V.sel = S.ui.selPart;
      V.setModel(colorList(list, S.ui.vivid), { reset: reset });
    }, [sig]);
    useEffect(function () { if (V) V.highlight(S.ui.selPart); }, [S.ui.selPart]);
    useEffect(function () { if (V) V.setDims(S.ui.dims && !layout); }, [S.ui.dims, layout]);
    useEffect(function () { if (V && !showPhoto) { V.w = 0; V.resize(); } }, [showPhoto]);
    var selR = E.parts.find(function (r) { return r.pt.id === S.ui.selPart; });
    function tog(k) { S.ui[k] = !S.ui[k]; commit('ui'); }
    var axes = V ? V.dragAxes() : [1, 1, 0];
    var dragHint = axes[2] ? (axes[0] ? 'במבט חזית גוררים לאורך ולגובה' : 'במבט צד גוררים לעומק ולגובה') : 'במבט הזה גוררים על הרצפה. ללמעלה ולמטה: מבט חזית או הכפתורים';
    return html`<div class="boardcol">
      <div class=${'board' + (build ? ' building' : '')}>
        <div class="board-canvas" ref=${host} hidden=${showPhoto || !V}></div>
        ${!V ? html`<div class="board-canvas"><div class="board-empty">השרטוט התלת־ממדי לא נטען בדפדפן הזה. רשימת החיתוכים והמחירים עובדים כרגיל.</div></div>` : null}
        ${showPhoto ? (photo ? html`<img class="board-photo" src=${photo} alt=${'תמונה של ' + item.name}/>` : html`<div class="board-canvas"><div class="board-empty">טוען תמונה…</div></div>`) : null}
        ${!showPhoto && layout ? html`<div class="board-note">לחלקים אין עדיין מיקום, לכן הם מוצגים פרוסים. לחצו "בנייה" כדי להרכיב מהם רהיט.</div>` : null}
        ${!showPhoto && build && list.length ? html`<div class="board-note">מצב בנייה · גוררים חלק כדי להזיז אותו · ${dragHint}</div>` : null}
        ${!showPhoto && !list.length && V ? html`<div class="board-empty">${build ? 'עוד אין חלקים בשרטוט. לחצו "+ חלק חדש" או "להוסיף לשרטוט" ליד חלק מהרשימה.' : 'הוסיפו חלקים לרשימה כדי לראות שרטוט'}</div>` : null}
        ${!showPhoto && selR && !build ? html`<div class="board-sel">${selR.pt.code} · ${selR.pt.name} · <span class="ltr">${fmtDim(selR.f.t)}×${fmtDim(selR.f.w)}×${fmtDim(selR.f.l)}</span> · ${selR.qty} יח׳</div>` : null}
      </div>
      <div class="board-tools">
        <button type="button" class=${'btn sm' + (build ? '' : ' primary')} aria-pressed=${build} onClick=${function () { if (build) { S.ui.build = false; commit('ui'); } else startBuild(null); }}>${build ? 'סיום בנייה' : 'בנייה והזזת חלקים'}</button>
        <div class="seg" role="group" aria-label="זווית מבט">
          ${[['iso', 'תלת־ממד'], ['front', 'חזית'], ['side', 'צד'], ['top', 'מלמעלה']].map(function (v) {
            return html`<button type="button" onClick=${function () { if (S.ui.photo) { S.ui.photo = false; commit('ui'); } if (V) { V.setView(v[0]); FORCE(); } }}>${v[1]}</button>`;
          })}
        </div>
        <div class="seg" role="group" aria-label="תצוגה">
          <button type="button" class=${S.ui.dims ? 'on' : ''} aria-pressed=${S.ui.dims} onClick=${function () { tog('dims'); }}>מידות</button>
          <button type="button" class=${S.ui.vivid ? 'on' : ''} aria-pressed=${S.ui.vivid} onClick=${function () { tog('vivid'); }}>צבע לכל חלק</button>
          ${photos.length && !build ? html`<button type="button" class=${S.ui.photo ? 'on' : ''} aria-pressed=${S.ui.photo} onClick=${function () { tog('photo'); }}>${photos.length > 1 ? 'תמונות (' + photos.length + ')' : 'תמונה'}</button>` : null}
          <button type="button" aria-label="הגדלה" onClick=${function () { if (V) V.zoomBy(1.25); }}>+</button>
          <button type="button" aria-label="הקטנה" onClick=${function () { if (V) V.zoomBy(0.8); }}>−</button>
        </div>
      </div>
      ${showPhoto ? html`<div class="photo-strip">
        ${photos.map(function (id, i) {
          var src = getImage(id);
          return html`<button key=${id} type="button" class=${'pthumb' + (id === curId ? ' on' : '')} aria-label=${'תמונה ' + (i + 1)} aria-pressed=${id === curId} onClick=${function () { S.ui.photoSel = id; FORCE(); }}>
            ${src ? html`<img src=${src} alt=""/>` : html`<span>…</span>`}${id === item.photo ? html`<span class="pstar">בהצעה</span>` : null}</button>`;
        })}
        <button type="button" class="pthumb add" onClick=${function () { morePhotos.current && morePhotos.current.click(); }}>+ עוד</button>
        <input type="file" accept="image/*" multiple hidden ref=${morePhotos} onChange=${function (e) { var f = Array.from(e.target.files || []); e.target.value = ''; if (f.length) attachPhotos(item, f); }}/>
        <span class="actions">
          ${curId && curId !== item.photo ? html`<button type="button" class="btn sm" onClick=${function () { item.photo = curId; item.img = 'photo'; commit('current'); toast('התמונה הזו תופיע בהצעה ללקוח'); }}>להציג אותה בהצעה</button>` : null}
          ${curId ? html`<button type="button" class="btn sm danger" onClick=${function () { removePhoto(item, curId); }}>הסרת התמונה</button>` : null}
        </span>
      </div>` : null}
      ${build ? html`<${BuildPanel} item=${item} E=${E}/>` : html`<div class="row">
        ${E.dims ? html`<span class="dimsline">מידות כוללות <b class="ltr">${dimsText(E)}</b> ${CM} <span class="hint">(אורך × עומק × גובה)</span></span>` : html`<span class="dimsline">אין עדיין מידות כוללות</span>`}
        <span class="hint">גררו לסיבוב · לחיצה על חלק מסמנת אותו בטבלה · אפשר לגרור לכאן תמונה או להדביק אותה</span>
      </div>`}
    </div>`;
  }

  /* The building panel: pick a part, then move, turn, stand up, drop and copy it. */
  function BuildPanel(props) {
    var item = props.item, E = props.E;
    var r = E.parts.find(function (x) { return x.pt.id === S.ui.selPart; }) || null;
    var unplaced = E.parts.filter(function (x) { return x.ok && x.qty > 0 && x.pt.placed === false; });
    var step = num(S.ui.step) || 5;
    var canUndo = !!(UNDO[item.id] && UNDO[item.id].length);
    var head = html`<div class="build-head">
      <b>${r ? 'החלק שנבחר' : 'בונים את הרהיט'}</b>
      <div class="actions">
        <button type="button" class="btn sm" disabled=${!canUndo} onClick=${function () { undoBuild(item); }}>ביטול פעולה</button>
        <button type="button" class="btn sm" onClick=${function () { addPart(item, E); }}>+ חלק חדש</button>
      </div>
    </div>`;
    var unplacedList = unplaced.length ? html`<div class="unplaced">
      <span class="lbl">חלקים מהרשימה שעוד לא בשרטוט</span>
      ${unplaced.map(function (x) {
        return html`<div key=${x.pt.id} class="row">
          <span><span class="sw" style=${'background:' + partColor(x.pt.code, x.idx, S.ui.vivid)}></span> ${x.pt.code} · ${x.pt.name} · <span class="ltr">${fmtDim(x.f.t)}×${fmtDim(x.f.w)}×${fmtDim(x.f.l)}</span> · ${x.qty} יח׳</span>
          <button type="button" class="btn sm" onClick=${function () { placePart(item, E, x); }}>להוסיף לשרטוט</button>
        </div>`;
      })}
    </div>` : null;
    if (!r) {
      return html`<section class="build">
        ${head}
        <ol class="build-steps">
          <li><b>בוחרים חלק:</b> לוחצים עליו בשרטוט או בטבלה, או מוסיפים "+ חלק חדש" ומכניסים לו מידות.</li>
          <li><b>גוררים אותו בשרטוט</b> למקום. הוא נצמד לקצוות של חלקים אחרים, כדי שיהיה קל ליישר.</li>
          <li><b>מכוונים בכפתורים</b> שיופיעו כאן: הזזה בסנטימטרים, סיבוב, העמדה, הנחה על מה שמתחת ועותקים.</li>
        </ol>
        ${unplacedList}
      </section>`;
    }
    var pt = r.pt, o = ORIENT_MAP[pt.orient] ? pt.orient : 'X-flat', posture = postureOf(o);
    var standLabel = posture === 'flat' ? 'להעמיד על הצד' : posture === 'edge' ? 'להעמיד זקוף' : 'להשכיב';
    var ca = copyAxis(pt), nLiteral = /^\s*\d+\s*$/.test(String(pt.n == null ? '' : pt.n));
    function set(k) { return function (v) { pt[k] = v; commit('current'); }; }
    function mv(a, sgn) { return function () { var d = [0, 0, 0]; d[a] = sgn * step; movePart(item, pt.id, d); }; }
    return html`<section class="build">
      ${head}
      <div class="build-row">
        <span class="sw" style=${'background:' + partColor(pt.code, r.idx, S.ui.vivid)}></span>
        <input class="cell w-code" value=${pt.code} maxlength="3" aria-label="קוד החלק" onInput=${function (e) { pt.code = e.target.value.toUpperCase(); commit('current'); }}/>
        <input class="cell" style="flex:1;min-width:120px" value=${pt.name} aria-label="שם החלק" onInput=${function (e) { pt.name = e.target.value; commit('current'); }}/>
        <button type="button" class="ibtn" aria-label="ביטול הבחירה" title="ביטול הבחירה" onClick=${function () { S.ui.selPart = null; FORCE(); }}>${Ico.close()}</button>
      </div>
      ${pt.placed === false ? html`<div class="okbox row"><span>החלק הזה עוד לא בשרטוט.</span><button type="button" class="btn sm primary" onClick=${function () { placePart(item, E, r); }}>להוסיף לשרטוט</button></div>` : html`
      <div class="build-row">
        <span class="lbl">מידות</span>
        <label class="f">עובי<${Expr} v=${pt.t} val=${r.f.t} err=${r.errs.t} on=${set('t')} obj=${pt} k="t" label="עובי"/></label>
        <label class="f">רוחב<${Expr} v=${pt.w} val=${r.f.w} err=${r.errs.w} on=${set('w')} obj=${pt} k="w" label="רוחב"/></label>
        <label class="f">אורך<${Expr} v=${pt.l} val=${r.f.l} err=${r.errs.l} on=${set('l')} obj=${pt} k="l" label="אורך"/></label>
      </div>
      <div class="build-row">
        <span class="lbl">מצב</span>
        <span class="state">${ORIENT_MAP[o][1]}</span>
        <button type="button" class="btn sm" onClick=${function () { reorient(item, r, TURN[o]); }}>סיבוב 90°</button>
        <button type="button" class="btn sm" onClick=${function () { reorient(item, r, STAND[o]); }}>${standLabel}</button>
      </div>
      <div class="build-row">
        <span class="lbl">הטיה</span>
        <button type="button" class="btn sm" aria-label="להטות פחות" onClick=${function () { pushUndo(item); pt.tilt = bumpExpr(pt.tilt, -5); commit('current'); }}>${lri('−5°')}</button>
        <${Expr} v=${pt.tilt == null ? '0' : pt.tilt} val=${r.f.tilt} err=${r.errs.tilt} on=${set('tilt')} obj=${pt} k="tilt" cls="w-n" label="זווית הטיה במעלות"/>
        <button type="button" class="btn sm" aria-label="להטות יותר" onClick=${function () { pushUndo(item); pt.tilt = bumpExpr(pt.tilt, 5); commit('current'); }}>${lri('+5°')}</button>
        <select class="cell" style="width:auto" value=${pt.tiltAxis === 'y' ? 'y' : 'x'} aria-label="כיוון ההטיה" onChange=${function (e) { pushUndo(item); pt.tiltAxis = e.target.value; commit('current'); }}>
          <option value="x">קדימה ואחורה</option><option value="y">לצדדים</option>
        </select>
      </div>
      <div class="build-row">
        <span class="lbl">הזזה</span>
        <span class="chips">${['1', '5', '10'].map(function (s) { var on = String(step) === s; return html`<button key=${s} type="button" class=${'chip' + (on ? ' on' : '')} aria-pressed=${on} onClick=${function () { S.ui.step = s; commit('ui'); }}>${s} ${CM}</button>`; })}</span>
      </div>
      <div class="pads">
        <span class="pad"><button type="button" class="btn sm" onClick=${mv(0, 1)}>→ ימינה</button><button type="button" class="btn sm" onClick=${mv(0, -1)}>שמאלה ←</button></span>
        <span class="pad"><button type="button" class="btn sm" onClick=${mv(1, -1)}>קדימה</button><button type="button" class="btn sm" onClick=${mv(1, 1)}>אחורה</button></span>
        <span class="pad"><button type="button" class="btn sm" onClick=${mv(2, 1)}>↑ למעלה</button><button type="button" class="btn sm" onClick=${mv(2, -1)}>↓ למטה</button></span>
      </div>
      <div class="build-row">
        <button type="button" class="btn sm" onClick=${function () { dropPart(item, E, pt.id, false); }}>להניח על מה שמתחת</button>
        <button type="button" class="btn sm" onClick=${function () { dropPart(item, E, pt.id, true); }}>להוריד לרצפה</button>
      </div>
      <div class="build-row">
        <span class="lbl">עותקים</span>
        ${nLiteral ? html`<${Stepper} id=${'bn-' + pt.id} label="מספר עותקים" min=${1} value=${pt.n} onChange=${function (v) { pt.n = String(Math.max(1, Math.round(num(v)) || 1)); commit('current'); }}/>`
          : html`<${Expr} v=${pt.n} val=${r.f.n} err=${r.errs.n} on=${set('n')} obj=${pt} k="n" cls="w-n" label="מספר עותקים"/>`}
        ${r.n > 1 ? html`
          <label class="f">בכיוון
            <select class="cell" value=${String(ca)} onChange=${function (e) { setCopyAxis(item, pt, +e.target.value); }}>
              ${AXES.map(function (x, i) { return html`<option value=${String(i)}>${x.label}</option>`; })}
            </select></label>
          <label class="f">מרחק מתחילת עותק לבא<${Expr} v=${pt[AXES[ca].step]} val=${r.f[AXES[ca].step]} err=${r.errs[AXES[ca].step]} on=${set(AXES[ca].step)} obj=${pt} k=${AXES[ca].step} label="מרחק בין עותקים"/></label>
          <button type="button" class="btn sm" onClick=${function () { spreadCopies(item, E, r); }}>לפרוס על כל ${AXES[ca].noun}</button>` : null}
      </div>
      <div class="build-row">
        <button type="button" class="btn sm" onClick=${function () { dupPart(item, pt, E); }}>שכפול לידו</button>
        <button type="button" class="btn sm" onClick=${function () { unplacePart(item, pt); }}>הוצאה מהשרטוט</button>
        <button type="button" class="btn sm danger" onClick=${function () { delPart(item, pt); }}>מחיקה</button>
      </div>
      <div class="row">
        <span class="hint">פינה שמאלית־קדמית־תחתונה: אורך ${fmtDim(r.f.x)} · עומק ${fmtDim(r.f.y)} · גובה ${fmtDim(r.f.z)} ${CM}</span>
        <button type="button" class="linkbtn" onClick=${function () {
          S.ui.place[pt.id] = true; commit('ui');
          setTimeout(function () { var row = document.getElementById('pr-' + pt.id); if (row && row.scrollIntoView) row.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 60);
        }}>עריכה מדויקת בטבלה</button>
      </div>`}
      ${unplacedList}
    </section>`;
  }

  /* Which size controls a formula follows, in words: "L-2*T" → "אורך, עובי רגל". */
  function sliderDeps(src, it, names, seen) {
    String(src || '').replace(/[A-Za-z_]\w*/g, function (k) {
      if (FUNCS[k.toLowerCase()] || seen[k]) return k;
      seen[k] = true;
      var p = it && it.params.find(function (x) { return x.key === k; });
      if (!p) return k;
      if (p.type === 'range' || p.type === 'choice') { if (names.indexOf(p.label) < 0) names.push(p.label); }
      else if (p.type === 'calc') sliderDeps(p.expr, it, names, seen);
      return k;
    });
    return names;
  }
  /* The sliders a formula follows, in words: "D-2" → "שלבים במשטח, מרווח בין שלבים". Empty when only fixed sizes are involved. */
  function followsText(src) { return sliderDeps(src, selItem(), [], {}).join(', '); }
  function isLiteral(s) { return /^\s*-?\d+(\.\d+)?\s*$/.test(String(s == null ? '' : s)); }

  /* A size cell. It always shows a number; a number that follows the sliders carries a link mark.
     Typing a number fixes it (the formula is kept so it can be linked back). "Show formulas" reveals the formula itself. */
  function Expr(props) {
    var s = props.v == null ? '' : String(props.v);
    var literal = isLiteral(s);
    var showFormula = props.always || S.ui.formulas;
    var obj = props.obj, k = props.k;
    var saved = obj && k && obj.auto && obj.auto[k] != null && literal && followsText(obj.auto[k]) ? obj.auto[k] : null;
    var linked = !literal && !props.err && s.trim() !== '' && !!followsText(s);
    var shown = showFormula || literal || props.err ? s : fmtDim(props.val);
    function onInput(e) {
      var v = e.target.value;
      if (!showFormula) {
        v = v.replace(',', '.');
        if (obj && k && !isLiteral(obj[k]) && !isBlank(obj[k])) { obj.auto = obj.auto || {}; if (obj.auto[k] == null) obj.auto[k] = obj[k]; }
      }
      props.on(v);
    }
    function relink() { if (!obj || !k || saved == null) return; obj[k] = saved; delete obj.auto[k]; commit('current'); }
    return html`<div class=${'expr' + (props.err ? ' bad' : '') + (linked && !showFormula ? ' linked' : '')}>
      <div class="exprbox">
        <input class=${'cell ltr ' + (props.cls || 'w-d')} dir="ltr" value=${shown} aria-label=${props.label} title=${props.err || (linked ? 'משתנה לבד לפי: ' + followsText(s) : '')}
          inputmode=${showFormula ? 'text' : 'decimal'} spellcheck="false" autocomplete="off" autocapitalize="off" onInput=${onInput} onFocus=${props.onFocus}/>
        ${linked && !showFormula ? html`<button type="button" class="linkmark" aria-label=${'משתנה לבד לפי ' + followsText(s)} title=${'משתנה לבד לפי: ' + followsText(s)}
          onClick=${function () { toast('המספר הזה משתנה לבד לפי: ' + followsText(s) + '. כדי לקבע אותו, מקלידים מספר.'); }}>${Ico.link()}</button>` : null}
        ${saved != null && !showFormula ? html`<button type="button" class="linkmark off" aria-label="לחבר שוב לסליידרים" title=${'לחבר שוב לסליידרים (' + followsText(saved) + ')'}
          onClick=${relink}>${Ico.relink()}</button>` : null}
      </div>
      ${props.err ? html`<span class="ev">${showFormula ? props.err : 'צריך להקליד מספר'}</span>` : (showFormula && !literal ? html`<span class="ev">= ${fmtDim(props.val)}</span>` : null)}
    </div>`;
  }

  function PartRow(props) {
    var r = props.r, item = props.item, Q = props.Q, pt = r.pt;
    var open = !!S.ui.place[pt.id], sel = S.ui.selPart === pt.id;
    function set(k) { return function (v) { pt[k] = v; commit('current'); }; }
    function focus() { if (S.ui.selPart !== pt.id) { S.ui.selPart = pt.id; FORCE(); } }
    var prof = r.ok ? findProfile(S.prices.profiles, r.f.t, r.f.w, pt.profile) : null;
    var auto = r.ok ? findProfile(S.prices.profiles, r.f.t, r.f.w, '') : null;
    var color = partColor(pt.code, r.idx, S.ui.vivid);
    var rows = [html`<tr key=${pt.id} class=${'prow' + (sel ? ' sel' : '')} onMouseEnter=${function () { if (MAINV) MAINV.highlight(pt.id); }} onMouseLeave=${function () { if (MAINV) MAINV.highlight(S.ui.selPart); }}>
      <td class="c-code"><div class="codecell"><span class="sw" style=${'background:' + color}></span><input class="cell w-code" value=${pt.code} maxlength="3" aria-label="קוד החלק" onInput=${function (e) { pt.code = e.target.value.toUpperCase(); commit('current'); }} onFocus=${focus}/></div></td>
      <td class="c-name"><input class="cell w-name" value=${pt.name} aria-label="שם החלק" onInput=${function (e) { pt.name = e.target.value; commit('current'); }} onFocus=${focus}/></td>
      <td class="c-dim" data-label="כמות"><${Expr} v=${pt.n} val=${r.f.n} err=${r.errs.n} on=${set('n')} obj=${pt} k="n" cls="w-n" label="כמות ליחידה" onFocus=${focus}/>${r.n2 > 1 ? html`<span class="ev">× ${r.n2} = ${r.qty}</span>` : null}</td>
      <td class="c-dim" data-label="עובי"><${Expr} v=${pt.t} val=${r.f.t} err=${r.errs.t} on=${set('t')} obj=${pt} k="t" label="עובי" onFocus=${focus}/></td>
      <td class="c-dim" data-label="רוחב"><${Expr} v=${pt.w} val=${r.f.w} err=${r.errs.w} on=${set('w')} obj=${pt} k="w" label="רוחב" onFocus=${focus}/></td>
      <td class="c-dim" data-label="אורך"><${Expr} v=${pt.l} val=${r.f.l} err=${r.errs.l} on=${set('l')} obj=${pt} k="l" label="אורך" onFocus=${focus}/></td>
      <td class="c-prof" data-label="קורה מהמחירון">
        <select class="cell w-prof" value=${pt.profile || ''} aria-label="קורה" onChange=${function (e) { pt.profile = e.target.value; commit('current'); }}>
          <option value="">${auto ? 'אוטומטי · ' + lri(sec(num(auto.t), num(auto.w))) : 'אוטומטי'}</option>
          ${S.prices.profiles.map(function (p) { return html`<option value=${p.id}>${lri(sec(num(p.t), num(p.w)))} · ${fmtDim(num(p.len))} ${CM}</option>`; })}
        </select>
        ${r.ok && !prof ? html`<span class="ev bad">אין במחירון קורה ${lri(sec(r.f.t, r.f.w))}</span>` : null}
      </td>
      <td class="c-num c-tot" data-label="להזמנה">${r.qty * Q}</td>
      <td class="c-act"><div class="rowbtns">
        <button type="button" class=${'ibtn' + (S.ui.build && sel ? ' on' : '')} title="להזיז בשרטוט" aria-label="להזיז את החלק בשרטוט" onClick=${function () { startBuild(pt.id); }}>${Ico.move()}</button>
        <button type="button" class="ibtn" title="שכפול" aria-label="שכפול החלק" onClick=${function () { dupPart(item, pt, props.E); }}>${Ico.copy()}</button>
        <button type="button" class="ibtn del" title="מחיקה" aria-label="מחיקת החלק" onClick=${function () { delPart(item, pt); }}>${Ico.trash()}</button>
      </div></td>
    </tr>`];
    if (open) {
      var ex = function (k, label) { return html`<label class="f">${label}<${Expr} v=${pt[k]} val=${r.f[k]} err=${r.errs[k]} on=${set(k)} obj=${pt} k=${k} label=${label}/></label>`; };
      rows.push(html`<tr key=${pt.id + '-pl'} class="place-row"><td colspan="9"><div class="place">
        <label class="check"><input type="checkbox" checked=${pt.placed !== false} onChange=${function (e) { pt.placed = e.target.checked; commit('current'); }}/> מופיע בשרטוט</label>
        <label class="f">כיוון החלק
          <select class="cell" value=${pt.orient} onChange=${function (e) { pt.orient = e.target.value; commit('current'); }}>
            ${ORIENTS.map(function (o) { return html`<option value=${o[0]}>${o[1]}</option>`; })}
          </select></label>
        <fieldset><legend>מיקום הפינה השמאלית־קדמית־תחתונה</legend>${ex('x', 'X אורך')}${ex('y', 'Y עומק')}${ex('z', 'Z גובה')}</fieldset>
        <fieldset><legend>מרחק בין עותקים</legend>${ex('dx', 'X')}${ex('dy', 'Y')}${ex('dz', 'Z')}</fieldset>
        <fieldset><legend>שורה נוספת של עותקים</legend>${ex('n2', 'כמה שורות')}${ex('dx2', 'X')}${ex('dy2', 'Y')}${ex('dz2', 'Z')}</fieldset>
        <fieldset><legend>הטיה (מעלות)</legend>${ex('tilt', 'זווית')}
          <label class="f">כיוון<select class="cell" value=${pt.tiltAxis === 'y' ? 'y' : 'x'} onChange=${function (e) { pt.tiltAxis = e.target.value; commit('current'); }}><option value="x">קדימה ואחורה</option><option value="y">לצדדים</option></select></label></fieldset>
        <button type="button" class="linkbtn" onClick=${function () { S.ui.place[pt.id] = false; commit('ui'); }}>סגירה</button>
      </div></td></tr>`);
    }
    return rows;
  }

  function PartsTable(props) {
    var item = props.item, E = props.E, Q = Math.max(0, Math.round(num(item.qty)));
    var vars = item.params.filter(function (p) { return KEY_RE.test(p.key || ''); });
    return html`<section class="panel">
      <div class="panel-head">
        <div><h3 class="h-sec">רשימת חלקים וחיתוכים</h3><p class="sub">מידות בס״מ: עובי × רוחב × אורך. מספר עם הסימן <span class="linkmark inline">${Ico.link()}</span> משתנה לבד כשמזיזים את הסליידרים. כדי לקבע מידה, פשוט מקלידים מספר אחר.</p></div>

      <label class="check" style="margin-top:10px;font-size:.8rem;color:var(--muted)"><input type="checkbox" checked=${!!S.ui.formulas} onChange=${function (e) { S.ui.formulas = e.target.checked; commit('ui'); }}/> הצגת הנוסחאות שמאחורי המספרים (למתקדמים)</label>
      ${S.ui.formulas ? html`<div class="vars"><span>פרמטרים לנוסחאות:</span>
        ${vars.map(function (p) { return html`<span title=${p.label}><span class="var">${p.key} = ${fmtDim(E.vars[p.key])}</span> ${p.label}</span>`; })}
      </div>` : null}
    </section>`;

  function ParamEditor(props) {
    var item = props.item, E = props.E;
    function set(p, k) { return function (e) { p[k] = e.target.value; commit('current'); }; }
    function setNum(p, k) { return function (e) { p[k] = num(e.target.value); commit('current'); }; }
    function optsText(p) { return (p.options || []).map(function (o) { return o.label != null && String(o.label) !== String(o.v) ? o.v + ':' + o.label : String(o.v); }).join(', '); }
    function setOpts(p, s) {
      p.options = s.split(/[,،]/).map(function (x) { var m = x.split(':'); return m[0].trim() === '' ? null : { v: num(m[0]), label: (m[1] != null ? m.slice(1).join(':') : m[0]).trim() }; }).filter(Boolean);
      if (p.options.length && !p.options.some(function (o) { return o.v === num(p.value); })) p.value = p.options[0].v;
      commit('current');

    return html`<details class="panel adv">

      <div class="tscroll"><table class="grid">
        <thead><tr><th>מפתח</th><th>שם</th><th>סוג</th><th>מינימום</th><th>מקסימום</th><th>קפיצה</th><th>ערך או נוסחה</th><th>אפשרויות (ערך:תווית)</th><th></th></tr></thead>
        <tbody>${item.params.map(function (p, i) {
          var bad = !KEY_RE.test(p.key || '');
          return html`<tr key=${i}>
            <td><div class=${'expr' + (bad ? ' bad' : '')}><input class="cell ltr w-n" dir="ltr" value=${p.key} aria-label="מפתח" onInput=${set(p, 'key')}/>${bad ? html`<span class="ev">אותיות באנגלית בלבד</span>` : null}</div></td>

            <td><select class="cell" value=${p.type} aria-label="סוג" onChange=${function (e) { p.type = e.target.value; if (p.type === 'range') { p.min = p.min != null ? p.min : 0; p.max = p.max != null ? p.max : 100; p.step = p.step || 1; p.unit = p.unit != null ? p.unit : CM; } if (p.type === 'choice' && !(p.options || []).length) p.options = [{ v: num(p.value), label: String(num(p.value)) }]; if (p.type === 'calc' && p.expr == null) p.expr = String(num(p.value)); commit('current'); }}>
              <option value="range">סליידר</option><option value="choice">בחירה</option><option value="const">קבוע</option><option value="calc">מחושב</option>
            </select></td>
            <td>${p.type === 'range' ? html`<input class="cell w-n" inputmode="decimal" value=${p.min} aria-label="מינימום" onChange=${setNum(p, 'min')}/>` : null}</td>
            <td>${p.type === 'range' ? html`<input class="cell w-n" inputmode="decimal" value=${p.max} aria-label="מקסימום" onChange=${setNum(p, 'max')}/>` : null}</td>
            <td>${p.type === 'range' ? html`<input class="cell w-n" inputmode="decimal" value=${p.step} aria-label="קפיצה" onChange=${setNum(p, 'step')}/>` : null}</td>
            <td>${p.type === 'calc' ? html`<${Expr} v=${p.expr} val=${E.vars[p.key]} err=${E.paramErr[p.key]} on=${function (v) { p.expr = v; commit('current'); }} always=${true} label="נוסחה"/>`
              : html`<input class="cell w-n" inputmode="decimal" value=${p.value} aria-label="ערך" onChange=${setNum(p, 'value')}/>`}</td>
            <td>${p.type === 'choice' ? html`<input class="cell" style="min-width:150px" value=${optsText(p)} aria-label="אפשרויות" onChange=${function (e) { setOpts(p, e.target.value); }}/>` : null}</td>
            <td><button type="button" class="ibtn del" aria-label="מחיקת פרמטר" onClick=${function () { item.params.splice(i, 1); commit('current'); }}>${Ico.trash()}</button></td>
          </tr>`;
        })}</tbody>
      </table></div>
      <div class="actions" style="margin-top:10px">
        <button type="button" class="btn sm" onClick=${function () {
          var k = 'P' + (item.params.length + 1);
          item.params.push({ key: k, label: 'פרמטר חדש', type: 'range', min: 0, max: 100, step: 1, value: 50, unit: CM }); commit('current');
        }}>+ פרמטר</button>
      </div>
    </details>`;
  }

  function ItemEditor(props) {
    var item = props.item, E = props.E, P = props.P;
    var fileRef = useRef(null), camRef = useRef(null);
    var sliders = item.params.filter(function (p) { return p.type === 'range' || p.type === 'choice'; });
    var fixed = item.params.filter(function (p) { return p.type === 'const' || p.type === 'calc'; });
    var vatOn = S.quote.pricing.vatOn, vr = num(S.quote.pricing.vat) / 100;

      e.target.value = '';

        ${sliders.length ? html`<div class="sec-title">בחירת מידות</div>` : null}
        ${sliders.map(function (p) { return html`<${ParamControl} key=${p.key} p=${p} item=${item}/>`; })}
        ${fixed.length ? html`<div class="fixed-list">${fixed.map(function (p) { return html`<span>${p.label}: <b class="num">${fmtDim(E.vars[p.key])}</b></span>`; })}</div>` : null}
        <div class="unitprice">

          <b>${money(P ? P.unit : 0)}</b>
          <small>עלות ${money(P ? P.directUnit : 0)} · ${vatOn ? 'כולל מע״מ ' + money((P ? P.unit : 0) * (1 + vr)) : 'ללא מע״מ'}</small>

          ${PREV[item.id] ? html`<button type="button" class="btn sm" onClick=${function () { var pv = PREV[item.id]; delete PREV[item.id]; item.params = pv.params; item.parts = pv.parts; commit('current'); toast('השינוי בוטל'); }}>ביטול השינוי האחרון</button>` : null}
          <button type="button" class="btn sm" onClick=${function () { fileRef.current && fileRef.current.click(); }}>${itemPhotos(item).length ? 'הוספת תמונות' : 'צירוף תמונות'}</button>

            <input type="file" accept="image/*" capture="environment" hidden ref=${camRef} onChange=${onPhoto}/>` : null}

          ${canSaveFiles() ? html`<button type="button" class="btn sm" onClick=${function () { saveFile((item.name || 'מוצר') + '.json', JSON.stringify(templateFromItem(item), null, 2), 'application/json'); }}>ייצוא מוצר</button>` : null}
          <button type="button" class="btn sm danger" onClick=${function () { removeItem(item); }}>מחיקה</button>
        </div>
      </section>
      <${Viewer3D} item=${item} E=${E}/>
    </div>`;
  }

  function TemplateCards(props) {
    var list = TEMPLATES.map(function (t) { return { t: t, mine: false }; }).concat(S.library.map(function (t) { return { t: t, mine: true }; }));
    return html`<div class="tpl-grid">
      ${list.map(function (x) {
        var t = x.t, thumb = null;
        if (t.parts && t.parts.length) { try { thumb = snapshotFor(evalItem(itemFromTemplate(t)), false); } catch (e) { thumb = null; } }
        if (!thumb && t.photo) thumb = getImage(t.photo);
        return html`<div key=${t.id} class="tpl" role="button" tabindex="0" onClick=${function () { props.onPick(t); }} onKeyDown=${function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); props.onPick(t); } }}>
          ${thumb ? html`<img class="thumb" src=${thumb} alt=""/>` : html`<div class="thumb blank">${t.id === 'blank' ? 'רשימת חיתוכים בלבד' : 'ללא שרטוט'}</div>`}
          <span class="t">${t.name}${x.mine ? html` <span class="pill">שלי</span>` : null}</span>
          <span class="d">${t.desc || ''}</span>
          ${x.mine ? html`<button type="button" class="linkbtn" style="align-self:flex-start" onClick=${function (e) {
            e.stopPropagation();
            confirmBox('למחוק את התבנית "' + t.name + '"?', 'התבנית תימחק מהרשימה שלך. מוצרים שכבר בהצעות לא ישתנו.', 'מחיקה', function () {
              S.library = S.library.filter(function (z) { return z.id !== t.id; }); commit('library'); delListItem('templates', t.id); closeModal();
