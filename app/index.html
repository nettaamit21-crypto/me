<title>לוח הנגרייה</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;600;700&display=swap">
<style>
  /* Layout: a workbench. A thin header, one working column (max 980px), a tab bar at the thumb on phones.
     Time is drawn as a carpenter's ruler: each day is a board, hours are the tick marks. */
  :root {
    --bg: #F3EDE3;        /* קרם */
    --surface: #FBF8F2;
    --sunk: #EAE0CF;      /* חול */
    --line: #DCCFB9;
    --ink: #2A1F17;       /* אגוז */
    --ink2: #6E5D4B;
    --oak: #9A6535;       /* אלון */
    --bronze: #B8874A;    /* ברונזה */
    --pine: #3F6650;
    --pine-soft: #E2EAE3;
    --rust: #9C4A32;
    --rust-soft: #F5E4DC;
    --amber: #8C5F0E;
    --amber-soft: #F6EBD3;
    --on-ink: #F3EDE3;

    --display: "Frank Ruhl Libre", "David Libre", Georgia, serif;
    --ui: "Heebo", "Arial Hebrew", "Noto Sans Hebrew", Arial, sans-serif;
    --r: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17120E; --surface: #211A14; --sunk: #2C231B; --line: #3B2F25;
      --ink: #F1E9DC; --ink2: #B6A48F; --oak: #D29B64; --bronze: #CDA46E;
      --pine: #8EC29F; --pine-soft: #1E2B23; --rust: #E8977F; --rust-soft: #3A221A;
      --amber: #E3B65C; --amber-soft: #33291A; --on-ink: #17120E;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17120E; --surface: #211A14; --sunk: #2C231B; --line: #3B2F25;
    --ink: #F1E9DC; --ink2: #B6A48F; --oak: #D29B64; --bronze: #CDA46E;
    --pine: #8EC29F; --pine-soft: #1E2B23; --rust: #E8977F; --rust-soft: #3A221A;
    --amber: #E3B65C; --amber-soft: #33291A; --on-ink: #17120E;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--ui); font-size: 15px; line-height: 1.5;
    direction: rtl; text-align: right; -webkit-font-smoothing: antialiased;
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  h1, h2, h3, h4 { margin: 0; line-height: 1.25; text-wrap: balance; }
  ul { list-style: none; margin: 0; padding: 0; }
  p { margin: 0; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--ink2); }
  .small { font-size: .84rem; }
  :focus-visible { outline: 2px solid var(--oak); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .wrap {
    max-width: 980px; margin-inline: auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  /* ---------- header + nav ---------- */
  header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
  .top .wrap { display: flex; align-items: center; gap: 10px 16px; padding-block: 10px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; margin-inline-end: auto; min-width: 0; }
  .mark { width: 34px; height: 34px; flex: none; border-radius: 8px; background: var(--ink); color: var(--on-ink); display: grid; place-items: center; }
  .mark svg { width: 22px; height: 22px; }
  .brand b { display: block; font-family: var(--display); font-weight: 700; font-size: 1.25rem; line-height: 1.1; }
  .brand span { display: block; font-size: .8rem; color: var(--ink2); }
  .sync { font-size: .76rem; color: var(--ink2); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--pine); display: inline-block; }
  .sync.local i { background: var(--amber); }
  .sync.busy i { background: var(--bronze); }
  .iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 38px; height: 38px; display: grid; place-items: center; padding: 0; }
  .iconbtn svg { width: 19px; height: 19px; }

  nav.tabs { display: flex; gap: 2px; }
  nav.tabs a {
    display: flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink2);
    padding: 7px 12px; border-radius: 8px; font-weight: 500; font-size: .92rem; white-space: nowrap;
  }
  nav.tabs a svg { width: 18px; height: 18px; }
  nav.tabs a[aria-current="page"] { background: var(--ink); color: var(--on-ink); }
  nav.tabs a .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--rust); }
  @media (max-width: 759px) {
    nav.tabs {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 25; background: var(--surface);
      border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr);
      padding: 4px max(6px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px));
    }
    nav.tabs a { flex-direction: column; gap: 1px; font-size: .72rem; padding: 6px 2px; justify-content: center; position: relative; }
    nav.tabs a svg { width: 21px; height: 21px; }
    nav.tabs a .dot { position: absolute; top: 5px; inset-inline-start: calc(50% + 8px); }
    nav.tabs a[aria-current="page"] { background: var(--sunk); color: var(--ink); }
  }

  main { padding-block: 18px calc(110px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 22px; }
  @media (min-width: 760px) { main { padding-bottom: 60px; } }

  /* ---------- type + sections ---------- */
  .pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; }
  .pagehead h1 { font-family: var(--display); font-weight: 700; font-size: 1.75rem; }
  .pagehead p { color: var(--ink2); font-size: .92rem; }
  .sec { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .sec > h2, .sechead h2 { font-size: 1.02rem; font-weight: 600; display: flex; align-items: baseline; gap: 8px; }
  .sec > h2 .c, .sechead h2 .c { font-weight: 400; color: var(--ink2); font-size: .85rem; }
  .sechead { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .lede { color: var(--ink2); font-size: .88rem; max-width: 68ch; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
  .card.tight { padding: 4px 12px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
  @media (max-width: 759px) { .grid2 { grid-template-columns: 1fr; } }

  /* ---------- buttons + controls ---------- */
  .btn {
    border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px;
    min-height: 40px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
  }
  .btn:hover { border-color: var(--ink2); }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
  .btn.oak { background: var(--oak); border-color: var(--oak); color: #fff; }
  .btn.ghost { background: transparent; }
  .btn.small { min-height: 32px; padding: 4px 10px; font-size: .86rem; }
  .btn.danger { color: var(--rust); }
  .btn.danger.armed { background: var(--rust); border-color: var(--rust); color: var(--surface); }
  .btn[disabled] { opacity: .55; cursor: default; }
  .btn svg { width: 17px; height: 17px; }
  .linkbtn { border: 0; background: none; padding: 0; color: var(--oak); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row.end { justify-content: flex-end; }
  .row.between { justify-content: space-between; }
  .spacer { flex: 1; }

  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field > label, .field > .lbl { font-size: .8rem; color: var(--ink2); font-weight: 500; }
  .field .help { font-size: .76rem; color: var(--ink2); }
  .ctl {
    width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 8px;
    padding: 8px 10px; min-height: 40px;
  }
  textarea.ctl { resize: vertical; min-height: 92px; line-height: 1.5; }
  .ctl:focus { outline: 2px solid var(--oak); outline-offset: 0; border-color: transparent; }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 12px; }
  .check { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--oak); }

  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
  .seg button { border: 0; background: none; padding: 6px 11px; color: var(--ink2); font-size: .86rem; min-height: 34px; }
  .seg button + button { border-inline-start: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
  .seg.state button[aria-pressed="true"][data-v="done"] { background: var(--pine); color: #fff; }
  .seg.state button[aria-pressed="true"][data-v="partial"] { background: var(--amber); color: #fff; }
  .seg.state button[aria-pressed="true"][data-v="not"] { background: var(--rust); color: #fff; }

  .chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; font-size: .76rem; line-height: 1.7; white-space: nowrap; color: var(--ink2); }
  .chip.oak { border-color: var(--oak); color: var(--oak); }
  .chip.pine { border-color: var(--pine); color: var(--pine); background: var(--pine-soft); }
  .chip.rust { border-color: var(--rust); color: var(--rust); background: var(--rust-soft); }
  .chip.amber { border-color: var(--amber); color: var(--amber); background: var(--amber-soft); }
  .chip.solid { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }

  /* ---------- attention strip ---------- */
  .alerts { display: flex; flex-direction: column; gap: 8px; }
  .alert {
    display: flex; align-items: center; gap: 12px; text-align: right; width: 100%;
    background: var(--surface); border: 1px solid var(--line); border-inline-start: 4px solid var(--bronze);
    border-radius: 8px; padding: 10px 12px;
  }
  .alert.hot { border-inline-start-color: var(--rust); background: var(--rust-soft); }
  .alert.go { border-inline-start-color: var(--pine); }
  .alert .t { flex: 1; min-width: 0; }
  .alert .t b { display: block; font-weight: 600; }
  .alert .t span { display: block; font-size: .82rem; color: var(--ink2); }
  .alert .go-ico { color: var(--ink2); flex: none; }
  .alert .go-ico svg { width: 18px; height: 18px; transform: scaleX(-1); }

  /* ---------- tasks ---------- */
  .tasks { display: flex; flex-direction: column; }
  .task { display: flex; gap: 10px; align-items: flex-start; padding: 8px 2px; border-bottom: 1px solid var(--line); }
  .tasks .task:last-child { border-bottom: 0; }
  .tick {
    flex: none; width: 24px; height: 24px; margin-top: 1px; border-radius: 50%; border: 1.6px solid var(--ink2);
    background: transparent; padding: 0; display: grid; place-items: center;
  }
  .tick:hover { border-color: var(--pine); }
  .task.done .tick { background: var(--pine); border-color: var(--pine); }
  .task.done .tick::after { content: ""; width: 10px; height: 5px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(0, -1px); }
  .tbody { flex: 1; min-width: 0; border: 0; background: none; padding: 0; text-align: right; display: flex; flex-direction: column; gap: 3px; }
  .ttl { font-weight: 500; overflow-wrap: anywhere; line-height: 1.4; }
  .task.done .ttl { color: var(--ink2); text-decoration: line-through; text-decoration-color: var(--line); font-weight: 400; }
  .task.hi .ttl::before { content: "●"; color: var(--rust); font-size: .6em; vertical-align: middle; margin-inline-end: 6px; }
  .tmeta { display: flex; flex-wrap: wrap; gap: 4px 6px; font-size: .78rem; color: var(--ink2); align-items: center; }
  .tmeta .tag { color: var(--oak); font-weight: 500; }
  .quick { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .quick .btn { min-height: 28px; padding: 2px 9px; font-size: .78rem; }
  .fixedrow { display: flex; gap: 10px; align-items: baseline; padding: 6px 10px; border-radius: 6px; background: var(--sunk); font-size: .86rem; }
  .fixedrow b { font-weight: 600; white-space: nowrap; }
  .fixedrow.soft { background: transparent; border: 1px dashed var(--line); color: var(--ink2); }
  .fixedrow.off { background: var(--amber-soft); color: var(--amber); }
  .timeline { display: flex; flex-direction: column; gap: 6px; }
  .empty { border: 1px dashed var(--line); border-radius: 8px; padding: 14px; color: var(--ink2); font-size: .9rem; }

  /* ---------- the ruler (a day's capacity) ---------- */
  .ruler { position: relative; height: 12px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
  .ruler::before {
    content: ""; position: absolute; inset: 0;
    background-image: repeating-linear-gradient(to left, var(--ink2) 0 1px, transparent 1px 100%);
    background-size: calc(100% / var(--h, 8)) 100%; background-position: right top; opacity: .35; z-index: 2;
  }
  .ruler i { position: absolute; inset-block: 0; inset-inline-start: 0; width: var(--fill, 0%); background: var(--bronze); border-radius: 0 3px 3px 0; }
  .ruler.done-part b { position: absolute; inset-block: 0; inset-inline-start: 0; width: var(--donefill, 0%); background: var(--pine); z-index: 1; }
  .ruler.over i { background: var(--rust); }
  .ruler.off { background: repeating-linear-gradient(45deg, var(--sunk) 0 6px, transparent 6px 12px); }

  /* ---------- week ---------- */
  .days { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 12px; align-items: start; }
  .day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .day.today { border-color: var(--oak); box-shadow: inset 0 3px 0 var(--oak); }
  .day.past { opacity: .82; }
  .day header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .day h3 { font-size: 1rem; font-weight: 600; }
  .day h3 span { font-weight: 400; color: var(--ink2); font-size: .85rem; margin-inline-start: 4px; }
  .day .load { font-size: .76rem; color: var(--ink2); }
  .day .load.over { color: var(--rust); font-weight: 600; }
  .add { align-self: flex-start; border: 0; background: none; color: var(--ink2); padding: 2px 4px; font-size: .86rem; border-radius: 6px; }
  .add:hover { color: var(--oak); }
  .deadline { font-size: .8rem; color: var(--rust); display: flex; gap: 6px; align-items: baseline; }
  .deadline::before { content: ""; width: 7px; height: 7px; transform: rotate(45deg); background: var(--rust); flex: none; }

  .weeknav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .weeknav h1 { margin-inline-end: auto; }

  /* ---------- capture + proposals ---------- */
  .capture { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .capture h2 { font-size: 1.02rem; font-weight: 600; }
  .mic { display: inline-flex; gap: 6px; align-items: center; font-size: .8rem; color: var(--ink2); }
  .mic svg { width: 16px; height: 16px; flex: none; }
  .proposal { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .prop { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  .prop.off { opacity: .5; }
  .prop .pb { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .prop .pb b { font-weight: 600; overflow-wrap: anywhere; }
  .kinds { display: flex; gap: 4px; flex-wrap: wrap; }
  .kinds button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; font-size: .74rem; padding: 1px 8px; color: var(--ink2); }
  .kinds button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
  .ai-note { font-size: .88rem; background: var(--sunk); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; }
  .thinking { display: inline-flex; gap: 8px; align-items: center; color: var(--ink2); font-size: .88rem; }
  .thinking i { width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--oak); border-radius: 50%; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .thinking i { animation: none; } }

  /* ---------- money ---------- */
  .figs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .fig { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; min-width: 0; }
  .fig span { display: block; font-size: .8rem; color: var(--ink2); }
  .fig b { display: block; font-family: var(--display); font-weight: 700; font-size: 1.55rem; line-height: 1.2; overflow-wrap: anywhere; }
  .fig.in b { color: var(--pine); }
  .fig.out b { color: var(--rust); }
  @media (max-width: 480px) { .fig b { font-size: 1.2rem; } .fig { padding: 10px; } }
  .lines { display: flex; flex-direction: column; }
  .mline { display: grid; grid-template-columns: minmax(0, 1fr) 112px; gap: 0 6px; padding: 6px 0; border-bottom: 1px solid var(--line); align-items: center; }
  .mline:last-child { border-bottom: 0; }
  .mline .lmeta { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .mline .lmeta .cdate { width: 150px; min-height: 30px; padding-block: 2px; }
  .mline .lmeta .spacer { flex: 1; }
  .line { display: grid; grid-template-columns: minmax(0, 1fr) 110px 132px auto; gap: 6px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); }
  .line:last-child { border-bottom: 0; }
  .line.ro { grid-template-columns: minmax(0, 1fr) auto; padding: 8px 0; }
  .line .acts { display: flex; gap: 2px; align-items: center; }
  .cell { width: 100%; min-width: 0; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 6px 6px; min-height: 36px; }
  .cell:hover { border-color: var(--line); }
  .cell:focus { background: var(--bg); border-color: var(--oak); outline: none; }
  .cell.amt { text-align: left; direction: ltr; font-variant-numeric: tabular-nums; }
  .cell.cdate { color: var(--ink2); font-size: .86rem; }
  .x { border: 0; background: none; color: var(--ink2); width: 32px; height: 32px; border-radius: 6px; display: grid; place-items: center; padding: 0; flex: none; }
  .x:hover { color: var(--rust); background: var(--rust-soft); }
  .x svg { width: 16px; height: 16px; }
  .pill { border: 1px solid var(--line); background: none; border-radius: 999px; font-size: .72rem; padding: 0 8px; line-height: 1.8; color: var(--ink2); }
  .pill[aria-pressed="true"] { background: var(--sunk); color: var(--ink); border-color: var(--bronze); }
  .total { display: flex; justify-content: space-between; gap: 10px; padding-top: 8px; margin-top: 2px; border-top: 2px solid var(--ink); font-weight: 600; }
  .amount { font-variant-numeric: tabular-nums; white-space: nowrap; direction: ltr; unicode-bidi: isolate; }
  .bars { display: flex; align-items: flex-end; gap: 10px; height: 120px; padding-top: 8px; }
  .bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; height: 100%; justify-content: flex-end; }
  .bar i { display: block; width: 100%; max-width: 46px; background: var(--pine); border-radius: 4px 4px 0 0; min-height: 2px; }
  .bar.neg i { background: var(--rust); }
  .bar.cur i { outline: 2px solid var(--oak); outline-offset: 1px; }
  .bar span { font-size: .72rem; color: var(--ink2); white-space: nowrap; }
  .bar em { font-style: normal; font-size: .72rem; font-variant-numeric: tabular-nums; }

  .docrow { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .docrow:last-child { border-bottom: 0; }
  .docrow .dm { flex: 1; min-width: 180px; text-align: right; border: 0; background: none; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .docrow .dm b { font-weight: 600; }
  .docrow .dm span { font-size: .8rem; color: var(--ink2); }

  /* ---------- month close ---------- */
  .steps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .step { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; text-align: right; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .step b { font-size: .84rem; font-weight: 600; display: flex; gap: 6px; align-items: center; }
  .step span { font-size: .74rem; color: var(--ink2); }
  .step .box { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--ink2); flex: none; display: grid; place-items: center; }
  .step.ok { border-color: var(--pine); background: var(--pine-soft); }

  /* =========================================================
     Pricing
     ========================================================= */
  function calcResult() {
    var c = S.calc, st = S.settings;
    var mat = num(c.materials), hours = num(c.hours), rate = c.rate === '' ? num(st.hourly) : num(c.rate);
    var cost = mat + hours * rate;
    var withProfit = cost * (1 + num(c.profit) / 100);
    var farm = Math.min(90, num(c.farm)) / 100;
    var pre = farm ? withProfit / (1 - farm) : withProfit;
    var vat = c.vatOn ? num(st.vat) / 100 : 0;
    var gross = pre * (1 + vat);
    var step = num(c.round) || 1;
    var rounded = Math.ceil(gross / step) * step;
    var finalPre = rounded / (1 + vat);

      toast('נוסף למאגר המשימות.');
    },

    /* money lines */
    addLine: function (id, arg) {
      var a = arg.split('|'), k = a[0], list = a[1], fixed = a[2] === 'fixed';
      var nid = uid();
      mutMonth(k, function (m) { m[list].push({ id: nid, name: '', amount: '', date: fixed ? '' : (monthKey(today()) === k ? today() : ''), fixed: fixed }); });
      S.focus = fid('ml:' + k + ':' + list + ':' + nid + ':name');
    },
    lineFixed: function (id, arg) { var a = arg.split('|'); mutMonth(a[0], function (m) { var l = findIn(m[a[1]], id); if (l) l.fixed = !l.fixed; }); },
    lineDel: function (id, arg) {
      var a = arg.split('|');
      if (!arm('lineDel|' + id)) { toast('ללחוץ שוב על הפח כדי למחוק.'); return; }
      mutMonth(a[0], function (m) { m[a[1]] = m[a[1]].filter(function (l) { return l.id !== id; }); });
    },
    lineDoc: function (id, arg) {
      var m = S.months[arg], l = m ? findIn(m.income, id) : null;
      if (!l) return;
      var d = newDoc({ kind: 'receipt', title: l.name, amount: l.amount, month: arg, by: l.date || today(), line: l.id, party: l.party || '' });
      openSheet({ type: 'doc', id: d.id });
    },

    /* documents */
    addDoc: function (id, arg) { var d = newDoc({ month: arg || monthKey(today()), party: '' }); openSheet({ type: 'doc', id: d.id }); S.focus = 'doc-party'; },
    openDoc: function (id, arg) { var key = id || arg; if (S.docs[key]) openSheet({ type: 'doc', id: key }); },
    docKind: function (id, arg) { var d = S.docs[id]; if (!d) return; d.kind = arg; persist('docs/' + id, 0); },
    docState: function (id, arg) {
      var d = S.docs[id];
      if (!d) return;
      d.state = arg;
      if (arg !== 'todo' && !d.issued) d.issued = today();
      if (arg === 'paid' && !d.paid) d.paid = today();
      persist('docs/' + id, 0);
    },
    docPaid: function (id) {
      var d = S.docs[id];
      if (!d) return;
      d.state = 'paid'; d.paid = d.paid || today();
      persist('docs/' + id, 0);
      toast('סומן כשולם. אם צריך, להוציא עכשיו קבלה.');
    },
    docReceipt: function (id) {
      var d = S.docs[id];
      if (!d) return;
      var r = newDoc({ kind: 'receipt', party: d.party, title: d.title || ('קבלה על ' + kindLabel(d.kind) + (d.number ? ' ' + d.number : '')), amount: d.amount, month: d.month, by: today() });
      openSheet({ type: 'doc', id: r.id });
    },
    docDel: function (id) { if (!arm('docDel|' + id)) return; delete S.docs[id]; Store.remove('docs/' + id); S.sheet = null; render(); toast('נמחק.'); },

    /* month close */
    addSession: function (id, arg) {
      var k = arg, nid = uid();
      mutMonth(k, function (m) {
        var lastS = m.hosen.sessions.map(function (s) { return s.date; }).sort().pop();
        m.hosen.sessions.push({ id: nid, date: lastS ? addDays(lastS, 7) : k + '-01', status: 'pending', agreed: '', arrived: '', price: '', note: '' });
      });
    },
    fillSessions: function (id, arg) {
      var k = arg, w = num(S.settings.hosen.weekday), added = 0;
      mutMonth(k, function (m) {
        var d = k + '-01';
        while (wd(d) !== w) d = addDays(d, 1);
        for (; monthKey(d) === k; d = addDays(d, 7)) {
          if (m.hosen.sessions.some(function (s) { return s.date === d; })) continue;
          var off = fixedOn(d).filter(function (f) { return f.off; })[0];
          m.hosen.sessions.push({ id: uid(), date: d, status: off ? 'notice' : 'pending', agreed: '', arrived: '', price: '', note: off ? off.title : '' });
          added++;
        }
        m.hosen.sessions.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
      });
      toast(added ? plural(added, 'מפגש אחד נוסף', 'מפגשים נוספו') + '. לסמן לכל אחד מה קרה.' : 'כל הימים כבר ברשימה.');
    },
    sesDel: function (id, arg) { if (!arm('sesDel|' + id)) { toast('ללחוץ שוב על הפח כדי למחוק.'); return; } mutMonth(arg, function (m) { m.hosen.sessions = m.hosen.sessions.filter(function (s) { return s.id !== id; }); }); },
    addSpecial: function (id, arg) { var nid = uid(); mutMonth(arg, function (m) { m.hosen.specials.push({ id: nid, desc: '', amount: '' }); }); S.focus = fid('hx:' + arg + ':' + nid + ':desc'); },
    spDel: function (id, arg) { mutMonth(arg, function (m) { m.hosen.specials = m.hosen.specials.filter(function (s) { return s.id !== id; }); }); },
    addFarm: function (id, arg) {
      var a = arg.split('|'), nid = uid();
      mutMonth(a[0], function (m) { m.farm[a[1]].push(a[1] === 'toMe' ? { id: nid, name: '', amount: '', kind: 'shop', rate: '' } : { id: nid, name: '', amount: '' }); });
      S.focus = fid('mf:' + a[0] + ':' + a[1] + ':' + nid + ':name');
    },
    farmDel: function (id, arg) { var a = arg.split('|'); mutMonth(a[0], function (m) { m.farm[a[1]] = m.farm[a[1]].filter(function (l) { return l.id !== id; }); }); },
    closeStep: function (id, arg) {
      var k = S.close;
      if (arg === 'invoice' && !farmInvoice(k)) { ACT.makeFarmInvoice(null, k); return; }
      if ((arg === 'invoice' || arg === 'paid') && farmInvoice(k)) { openSheet({ type: 'doc', id: farmInvoice(k).id }); return; }
      if (arg === 'sent') { ACT.markSent(null, k); return; }
      mutMonth(k, function (m) { m.close[arg] = !m.close[arg]; });
    },
    markSent: function (id, arg) { mutMonth(arg, function (m) { m.close.sent = m.close.sent ? null : today(); }); },
    makeFarmInvoice: function (id, arg) {
      var k = arg, f = farmCalc(monthOf(k));
      var nextMonth = shiftMonth(k, 1);
      var by = nextMonth + '-' + pad(Math.min(10, 28));
      var dl = (S.settings.deadlines || []).filter(function (x) { return x.kind === 'invoice'; })[0];
      if (dl && dl.day !== 'last') by = nextMonth + '-' + pad(Math.min(28, num(dl.day) || 10));
      var d = newDoc({ kind: 'invoice', auto: 'farm', party: S.settings.client.name, title: 'התחשבנות ' + monthLabel(k), amount: f.toMeVat, month: k, by: by });
      openSheet({ type: 'doc', id: d.id });
      toast('נוצרה תזכורת לחשבונית על ' + ils(f.toMeVat, true) + ' כולל מע״מ.');
    },
    exportXlsx: function (id, arg) { exportXlsx(arg); },
    exportHtml: function (id, arg) { exportHtml(arg); },
    copySummary: function (id, arg) { copyText(summaryText(arg)); },

    /* pricing */
    addPrice: function () { var nid = uid(); S.settings.prices.push({ id: nid, name: '', unit: 'יחידה', price: '', vat: 'incl', note: '' }); persist('app/settings'); S.focus = fid('sl:prices:' + nid + ':name'); },
    priceDel: function (id) { if (!arm('priceDel|' + id)) { toast('ללחוץ שוב על הפח כדי למחוק.'); return; } S.settings.prices = S.settings.prices.filter(function (p) { return p.id !== id; }); persist('app/settings'); },
    calcSave: function () {
      var r = calcResult();
      S.settings.prices.push({ id: uid(), name: S.calc.name || 'מוצר חדש', unit: 'יחידה', price: r.rounded, vat: S.calc.vatOn ? 'incl' : 'before', note: 'מהמחשבון ' + dm(today()) + ': חומרים ' + ils(S.calc.materials || 0) + ', ' + (S.calc.hours || 0) + ' שעות' });
      persist('app/settings');
      toast('נשמר במחירון.');
    },

    /* settings */
    hoursOff: function (id, arg) { var i = +arg; S.settings.hours[i] = S.settings.hours[i] ? null : ['08:00', '17:00']; persist('app/settings'); },
    addFixed: function () { S.settings.fixed.push({ id: 'fx' + uid(), weekday: 0, date: null, start: '09:00', end: '10:00', title: '', soft: false, off: false, allDay: false, skip: [] }); persist('app/settings'); },
    fixedDel: function (id) { S.settings.fixed = S.settings.fixed.filter(function (f) { return f.id !== id; }); persist('app/settings'); },
    addDeadline: function () { S.settings.deadlines.push({ id: 'dl' + uid(), day: 1, title: '', kind: 'custom' }); persist('app/settings'); },
    deadlineDel: function (id) { S.settings.deadlines = S.settings.deadlines.filter(function (f) { return f.id !== id; }); persist('app/settings'); },
    addLink: function () { S.settings.links.push({ id: 'ln' + uid(), title: '', url: '', sub: '' }); persist('app/settings'); },
    linkDel: function (id) { S.settings.links = S.settings.links.filter(function (f) { return f.id !== id; }); persist('app/settings'); },
    backupExport: function () {
      var getMonths = S.mode === 'db'
        ? Store.db.collection('months').get().then(function (q) { var o = {}; q.docs.forEach(function (d) { o[d.id] = clone(d.data()); }); return o; }, function () { return clone(S.months); })
        : Promise.resolve(LS.coll('months'));
      getMonths.then(function (months) {
        Object.keys(S.months).forEach(function (k) { months[k] = clone(S.months[k]); });
        var data = { app: 'lnag', v: 1, at: new Date().toISOString(), settings: S.settings, notes: S.notes, tasks: S.tasks, checkins: S.checkins, docs: S.docs, months: months };
        saveFile('גיבוי לוח הנגרייה ' + today() + '.json', new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' }));
      });
    },
    backupImport: function () { document.getElementById('file-import').click(); },
    backupApply: function () {
      var d = S.pendingImport && S.pendingImport.data;
      if (!d) return;
      if (d.settings) { S.settings = fillDefaults(d.settings, defaultSettings()); persist('app/settings', 0); }
      if (d.notes && Array.isArray(d.notes.items)) { S.notes = d.notes; persist('app/notes', 0); }
      ['tasks', 'checkins', 'docs', 'months'].forEach(function (c) {
        Object.keys(d[c] || {}).forEach(function (id) {
          if (!/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(id)) return;
          var v = d[c][id];
          if (!v || typeof v !== 'object') return;
          S[c][id] = c === 'tasks' ? fixTask(v, id) : c === 'months' ? fixMonth(v, id) : v;
          Store.save(c + '/' + id, 50);
        });
      });
      S.pendingImport = null;
      toast('הגיבוי נטען.');
      render();
    },
    backupCancel: function () { S.pendingImport = null; render(); }
  };

  /* =========================================================
     Events
     ========================================================= */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el || el.tagName === 'INPUT') return;
    var act = el.getAttribute('data-act');
    if (act === 'scrim') { if (e.target === el) closeSheet(); return; }
    if (S.armed && S.armed.split('|')[0] !== act) S.armed = null;
    var fn = ACT[act];
    if (!fn) return;
    e.preventDefault();
    fn(el.getAttribute('data-id'), el.getAttribute('data-arg'), el, e);
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.id === 'file-import') { readImport(el); return; }
    if (el.tagName === 'INPUT' && el.type === 'checkbox' && el.getAttribute('data-act')) {
      var fn = ACT[el.getAttribute('data-act')];
      if (fn) fn(el.getAttribute('data-id'), el.getAttribute('data-arg'), el, e);
      return;
    }
    if (el.getAttribute('data-bind')) applyBind(el);
  });
  document.addEventListener('input', function (e) {
    var el = e.target;
    if (!el.getAttribute || !el.getAttribute('data-bind')) return;
    if (el.type === 'checkbox' || el.tagName === 'SELECT') return;
    applyBind(el);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && S.sheet) closeSheet();
  });
  document.addEventListener('toggle', function (e) {
    var d = e.target;
    if (d.tagName === 'DETAILS' && d.getAttribute('data-k') && S.sheet && S.sheet.type === 'settings' && d.open) S.sheet.section = d.getAttribute('data-k').replace(/^set-/, '');
  }, true);
  function readImport(el) {
    var f = el.files && el.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var d = JSON.parse(rd.result);
        if (!d || d.app !== 'lnag') throw new Error('bad');
        S.pendingImport = { data: d, summary: [Object.keys(d.tasks || {}).length + ' משימות', Object.keys(d.months || {}).length + ' חודשים', Object.keys(d.docs || {}).length + ' מסמכים'].join(', ') };
        S.sheet = { type: 'settings', section: 'backup' };
        render();
      } catch (err) { toast('הקובץ הזה לא נראה כמו גיבוי של לוח הנגרייה.'); }
      el.value = '';
    };
    rd.readAsText(f);
  }

  /* =========================================================
     Render + routing + boot
     ========================================================= */
  var VIEWS = { today: vToday, week: vWeek, money: vMoney, close: vClose, prices: vPrices };
  function route() {
    var h = (location.hash || '').replace('#', '');
    var next = VIEWS[h] ? h : 'today';
    var changed = next !== S.view;
    S.view = next;
    render();
    if (changed) window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);

  function renderNow() {
    document.getElementById('today-line').textContent = hebDate(today());
    var al = S.mode === 'loading' ? [] : buildAlerts();
    Array.prototype.forEach.call(document.querySelectorAll('#nav a'), function (a) {
      var v = a.getAttribute('data-view');
      if (v === S.view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
      var dot = a.querySelector('.dot');
      var want = v === 'today' && S.view !== 'today' && al.some(function (x) { return x.hot; });
      if (want && !dot) { dot = document.createElement('i'); dot.className = 'dot'; dot.setAttribute('aria-hidden', 'true'); a.appendChild(dot); }
      if (!want && dot) dot.remove();
    });
    setSync();
    var view = document.getElementById('view');
    if (S.mode === 'loading' || !S.settingsSeen) {
      morph(view, '<div class="empty">טוען את הלוח…</div>');
      return;
    }
    var html = VIEWS[S.view]();
    if (S.mode === 'local' && !S.localNoted) html = '<div class="banner" data-k="local-note">הדף פתוח מחוץ ל־claude.ai, ולכן הנתונים נשמרים רק בדפדפן הזה ו־Claude לא זמין. כשהוא פתוח ב־claude.ai הכל מסונכרן בין הטלפון למחשב. ' + '<button type="button" class="linkbtn" data-act="hideLocal">הבנתי</button></div>' + html;
    morph(view, html);
    var root = document.getElementById('sheet-root');
    morph(root, sheetHTML());
    document.body.style.overflow = S.sheet ? 'hidden' : '';
    if (S.focus) {
      var f = document.getElementById(S.focus);
      S.focus = null;
      if (f) { try { f.focus({ preventScroll: false }); } catch (e) { f.focus(); } }
    }
  }
  ACT.hideLocal = function () { S.localNoted = true; render(); };
  ACT.toggleRolled = function () { S.showAllRolled = !S.showAllRolled; render(); };
  ACT.rolledAI = function () {
    var t = today(), to = addDays(weekStartOf(t), 6);
    if (daysBetween(t, to) < 2) to = addDays(to, 7);
    S.week = weekStartOf(t);
    runPlan(t, to, '', '', false);
  };

  function boot() {
    try { var c = JSON.parse(localStorage.getItem('lnag:ui:calc') || 'null'); if (c && typeof c === 'object') Object.assign(S.calc, c); } catch (e) { /* storage blocked */ }
    route();
    Store.init().then(function (mode) {
      S.mode = mode;
      startData();
      setTimeout(function () { if (!S.settingsSeen) { S.settingsSeen = true; render(); } }, 6000);
      render();
    });
    if (window.claude && typeof window.claude.use === 'function') {
      window.claude.use('sample').then(function (s) { S.ai = s || null; render(); }, function () { /* no Claude here */ });
      window.claude.use('downloads').then(function (d) { S.dl = d || null; }, function () { /* no downloads here */ });
    }
    var lastDay = today();
    setInterval(function () {
      var t = today();
      if (t !== lastDay) {
        if (S.week === weekStartOf(lastDay)) S.week = weekStartOf(t);
        if (S.money === monthKey(lastDay)) S.money = monthKey(t);
        lastDay = t;
        watchMonth(monthKey(t));
      }
      if (!S.sheet) render();
    }, 60000);
  }
  boot();
})();
</script>
