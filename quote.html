<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מחשבון הצעות הנגרייה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Heebo:wght@300;400;500;600;700&display=swap">
<style>
  :root {
    /* Layout: a workbench — the size controls sit beside a drawing board on graph paper; the running price is pinned to the bottom edge like a tally strip */
    --paper: #F4EEE5;
    --surface: #FFFCF7;
    --surface-2: #F1E8DB;
    --sunk: #ECE3D5;
    --ink: #241B14;
    --muted: #6B5A4B;
    --faint: #9A8977;
    --line: rgba(42, 31, 23, .13);
    --line-2: rgba(42, 31, 23, .26);
    --oak: #9A6535;
    --oak-2: #81512A;
    --on-oak: #FFF9F1;
    --brass: #B8874A;
    --walnut: #2A1F17;
    --on-walnut: #F3EDE3;
    --on-walnut-2: #C9B79E;
    --walnut-accent: #E7C796;
    --walnut-warn: #F2A88F;
    --board: #FBF8F2;
    --grid: rgba(154, 101, 53, .08);
    --grid-2: rgba(154, 101, 53, .15);
    --ok: #3D7A4C;
    --ok-bg: rgba(61, 122, 76, .11);
    --warn: #8E5A0C;
    --warn-bg: rgba(198, 135, 30, .14);
    --bad: #AE3E2A;
    --bad-bg: rgba(174, 62, 42, .10);
    --scrim: rgba(20, 14, 10, .45);
    --shadow: 0 1px 2px rgba(42, 31, 23, .06), 0 10px 28px -16px rgba(42, 31, 23, .30);

    --display: "Frank Ruhl Libre", "David Libre", "Times New Roman", serif;
    --ui: "Heebo", "Assistant", "Arial Hebrew", Arial, sans-serif;
    --radius: 8px;
    --gutter: clamp(16px, 3vw, 32px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #18120E; --surface: #221A14; --surface-2: #2B2119; --sunk: #1C1511;
      --ink: #F1E9DC; --muted: #BCA991; --faint: #8C7B68;
      --line: rgba(241, 233, 220, .11); --line-2: rgba(241, 233, 220, .22);
      --oak: #D49F5C; --oak-2: #E2B273; --on-oak: #1B140F; --brass: #C99561;
      --walnut: #0E0A07; --on-walnut: #F1E9DC; --on-walnut-2: #B8A58C; --walnut-accent: #E7C796; --walnut-warn: #F2A88F;
      --board: #1E1712; --grid: rgba(212, 159, 92, .06); --grid-2: rgba(212, 159, 92, .12);
      --ok: #82C094; --ok-bg: rgba(130, 192, 148, .12); --warn: #E6AE52; --warn-bg: rgba(230, 174, 82, .13);
      --bad: #EE8A72; --bad-bg: rgba(238, 138, 114, .12); --scrim: rgba(0, 0, 0, .6);
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px -14px rgba(0, 0, 0, .6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #18120E; --surface: #221A14; --surface-2: #2B2119; --sunk: #1C1511;
    --ink: #F1E9DC; --muted: #BCA991; --faint: #8C7B68;
    --line: rgba(241, 233, 220, .11); --line-2: rgba(241, 233, 220, .22);
    --oak: #D49F5C; --oak-2: #E2B273; --on-oak: #1B140F; --brass: #C99561;
    --walnut: #0E0A07; --on-walnut: #F1E9DC; --on-walnut-2: #B8A58C; --walnut-accent: #E7C796; --walnut-warn: #F2A88F;
    --board: #1E1712; --grid: rgba(212, 159, 92, .06); --grid-2: rgba(212, 159, 92, .12);
    --ok: #82C094; --ok-bg: rgba(130, 192, 148, .12); --warn: #E6AE52; --warn-bg: rgba(230, 174, 82, .13);
    --bad: #EE8A72; --bad-bg: rgba(238, 138, 114, .12); --scrim: rgba(0, 0, 0, .6);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px -14px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--ui); font-size: 15px; line-height: 1.55; font-weight: 400;
    direction: rtl; -webkit-font-smoothing: antialiased;
    padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  img { max-width: 100%; }
  h1, h2, h3, h4 { margin: 0; font-weight: 500; text-wrap: balance; }
  p { margin: 0; }
  .wrap { max-width: 1280px; margin-inline: auto; padding-inline: var(--gutter); }
  .ltr { direction: ltr; unicode-bidi: isolate; }
  .num { font-variant-numeric: tabular-nums; }
  .mut { color: var(--muted); font-weight: 400; }
  .boot { padding: 48px 24px; text-align: center; color: var(--muted); }
  :focus-visible { outline: 2px solid var(--oak); outline-offset: 2px; }
  input[type="checkbox"], input[type="radio"] { accent-color: var(--oak); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

  /* ---------- header & tabs ---------- */
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); border-bottom: 1px solid var(--line); }
  .top-row { display: flex; align-items: center; justify-content: space-between; gap: 8px 14px; min-height: 56px; flex-wrap: wrap; padding-block: 6px; }
  .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .brand-name { font-family: var(--display); font-size: 1.45rem; font-weight: 500; letter-spacing: .02em; }
  .brand-sub { font-size: .8rem; color: var(--muted); letter-spacing: .03em; }
  .top-actions { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .sync { font-size: .74rem; color: var(--faint); display: inline-flex; align-items: center; gap: 6px; margin-inline-end: 6px; white-space: nowrap; }
  .sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .sync.ok::before { background: var(--ok); }
  .sync.busy::before { background: var(--brass); }
  .sync.err::before { background: var(--bad); }
  .tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { appearance: none; border: 0; background: none; padding: 9px 14px 10px; font-size: .92rem; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .tab:hover { color: var(--ink); }
  .tab.on { color: var(--ink); border-bottom-color: var(--oak); font-weight: 500; }
  .tab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--bad); }
  @media (max-width: 700px) { .top { position: static; } .top-actions .btn { padding: 4px 7px; } .brand-name { font-size: 1.3rem; } }

  /* ---------- buttons ---------- */
  .btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 7px 12px; font-size: .88rem; font-weight: 500; cursor: pointer; line-height: 1.2; white-space: nowrap; }
  .btn:hover { border-color: var(--oak); color: var(--oak); }
  .btn.primary { background: var(--oak); border-color: var(--oak); color: var(--on-oak); }
  .btn.primary:hover { background: var(--oak-2); border-color: var(--oak-2); color: var(--on-oak); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
  .btn.sm { padding: 5px 10px; font-size: .82rem; }
  .btn.danger { color: var(--bad); }
  .btn.danger:hover { border-color: var(--bad); color: var(--bad); }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  .btn .badge { background: var(--surface-2); color: var(--muted); border-radius: 10px; padding: 0 6px; font-size: .72rem; font-weight: 500; }
  .linkbtn { appearance: none; background: none; border: 0; padding: 0; color: var(--oak); cursor: pointer; font-size: .85rem; text-decoration: underline; text-underline-offset: 3px; }
  .ibtn { appearance: none; border: 0; background: transparent; width: 30px; height: 30px; border-radius: 5px; cursor: pointer; color: var(--muted); display: inline-grid; place-items: center; flex: none; }
  .ibtn:hover { background: var(--surface-2); color: var(--ink); }
  .ibtn.on { color: var(--oak); background: var(--surface-2); }
  .ibtn.del:hover { color: var(--bad); }
  .ibtn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- layout ---------- */
  .main { display: flex; flex-direction: column; gap: 16px; padding-block: 18px 28px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .h-sec { font-family: var(--display); font-size: 1.25rem; font-weight: 500; }
  .h-min { font-size: .9rem; font-weight: 600; margin: 14px 0 6px; }
  .eyebrow { font-size: .72rem; letter-spacing: .1em; color: var(--oak); font-weight: 500; }
  .sub { color: var(--muted); font-size: .86rem; margin-top: 4px; max-width: 70ch; }
  .note { font-size: .82rem; color: var(--muted); }
  .hint { font-size: .78rem; color: var(--faint); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; }
  .gap { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .banner { display: flex; gap: 10px 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--warn-bg); border: 1px solid color-mix(in srgb, var(--warn) 28%, transparent); border-radius: var(--radius); padding: 10px 14px; font-size: .88rem; }
  .warnbox { background: var(--bad-bg); border: 1px solid color-mix(in srgb, var(--bad) 28%, transparent); border-radius: 6px; padding: 10px 12px; font-size: .86rem; display: flex; flex-direction: column; gap: 6px; }
  .okbox { background: var(--ok-bg); border-radius: 6px; padding: 10px 12px; font-size: .86rem; }
  .pill { display: inline-flex; align-items: center; font-size: .68rem; padding: 1px 7px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); font-weight: 600; white-space: nowrap; vertical-align: middle; }
  .bad-t { color: var(--bad); }

  /* ---------- quote head & item strip ---------- */
  .qhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; }
  .qtitle { display: flex; flex-direction: column; gap: 2px; flex: 1 1 320px; min-width: 0; }
  .title-in { border: 0; border-bottom: 1px dashed var(--line-2); background: transparent; font-family: var(--display); font-size: clamp(1.35rem, 3vw, 1.85rem); padding: 2px 0; width: 100%; color: var(--ink); }
  .title-in:focus { outline: none; border-bottom-color: var(--oak); }
  .strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  .ichip { appearance: none; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; padding: 8px 12px; cursor: pointer; text-align: right; min-width: 150px; max-width: 240px; flex: none; }
  .ichip .n { font-weight: 500; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .ichip .m { font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ichip.on { border-color: var(--oak); box-shadow: inset 0 0 0 1px var(--oak); background: color-mix(in srgb, var(--oak) 7%, var(--surface)); }
  .ichip.add { border-style: dashed; color: var(--oak); justify-content: center; align-items: center; min-width: 120px; font-weight: 500; }

  /* ---------- design tab ---------- */
  .design { display: grid; grid-template-columns: minmax(290px, 370px) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 900px) { .design { grid-template-columns: minmax(0, 1fr); } .design .boardcol { order: -1; } }
  .config { display: flex; flex-direction: column; gap: 14px; }
  .item-name { width: 100%; border: 0; border-bottom: 1px solid var(--line-2); background: transparent; font-family: var(--display); font-size: 1.3rem; padding: 2px 0; }
  .item-name:focus { outline: none; border-bottom-color: var(--oak); }
  .lbl { font-size: .86rem; color: var(--muted); }
  .sec-title { font-size: .76rem; letter-spacing: .1em; color: var(--oak); font-weight: 600; padding-top: 12px; border-top: 1px solid var(--line); }
  .stepper, .valbox { display: inline-flex; align-items: center; border: 1px solid var(--line-2); border-radius: 6px; overflow: hidden; background: var(--surface); flex: none; }
  .stepper button, .valbox button { appearance: none; border: 0; background: var(--surface-2); width: 30px; height: 30px; font-size: 1rem; cursor: pointer; color: var(--ink); }
  .stepper button:hover, .valbox button:hover { background: var(--sunk); }
  .stepper input, .valbox input { width: 56px; border: 0; text-align: center; background: transparent; height: 30px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .valbox .u { font-size: .74rem; color: var(--muted); padding-inline: 0 6px; }
  .pc { display: flex; flex-direction: column; gap: 6px; }
  .pc-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .pc-label { font-weight: 500; font-size: .92rem; }
  .pc-hint { display: block; font-size: .74rem; color: var(--faint); font-weight: 400; }
  .pc-scale { display: flex; justify-content: space-between; font-size: .72rem; color: var(--faint); direction: ltr; font-variant-numeric: tabular-nums; }
  .range { -webkit-appearance: none; appearance: none; width: 100%; height: 24px; background: transparent; direction: ltr; margin: 0; cursor: pointer; }
  .range::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--oak) var(--pct, 50%), var(--line-2) var(--pct, 50%)); }
  .range::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line-2); }
  .range::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--oak); }
  .range::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); border: 2px solid var(--oak); margin-top: -8px; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
  .range::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--surface); border: 2px solid var(--oak); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { appearance: none; border: 1px solid var(--line-2); background: var(--surface); border-radius: 16px; padding: 5px 12px; font-size: .85rem; cursor: pointer; font-variant-numeric: tabular-nums; }
  .chip:hover { border-color: var(--oak); }
  .chip.on { background: var(--oak); border-color: var(--oak); color: var(--on-oak); }
  .fixed-list { display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: .78rem; color: var(--muted); }
  .unitprice { display: flex; align-items: baseline; justify-content: space-between; gap: 4px 10px; flex-wrap: wrap; padding: 10px 12px; border-radius: 6px; background: var(--surface-2); }
  .unitprice b { font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .unitprice small { color: var(--muted); font-size: .78rem; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; }

  .boardcol { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .board { position: relative; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background-color: var(--board);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px), linear-gradient(var(--grid-2) 1px, transparent 1px), linear-gradient(90deg, var(--grid-2) 1px, transparent 1px);
    background-size: 16px 16px, 16px 16px, 80px 80px, 80px 80px; }
  .board-canvas { width: 100%; aspect-ratio: 16 / 11; max-height: min(64vh, 580px); min-height: 250px; }
  .v3d { position: relative; width: 100%; height: 100%; }
  .v3d canvas { display: block; width: 100%; height: 100%; }
  .v3d-labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .v3d-lab { position: absolute; left: 0; top: 0; font-size: .78rem; font-weight: 600; color: var(--ink); background: color-mix(in srgb, var(--board) 86%, transparent); padding: 0 6px; border-radius: 4px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .board-photo { display: block; width: 100%; aspect-ratio: 16 / 11; max-height: min(64vh, 580px); object-fit: contain; background: var(--board); }
  .board-note { position: absolute; inset-inline-start: 10px; top: 10px; max-width: calc(100% - 20px); font-size: .78rem; color: var(--muted); background: color-mix(in srgb, var(--board) 90%, transparent); padding: 3px 8px; border-radius: 4px; pointer-events: none; }
  .board-sel { position: absolute; inset-inline-start: 10px; bottom: 10px; max-width: calc(100% - 20px); font-size: .8rem; background: var(--surface); border: 1px solid var(--oak); color: var(--ink); padding: 3px 9px; border-radius: 4px; pointer-events: none; }
  .board-empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); font-size: .9rem; pointer-events: none; }
  .board-tools { display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 6px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
  .seg button { appearance: none; border: 0; background: transparent; padding: 5px 10px; font-size: .8rem; cursor: pointer; color: var(--muted); border-inline-start: 1px solid var(--line); }
  .seg button:first-child { border-inline-start: 0; }
  .seg button:hover { color: var(--ink); }
  .seg button.on { background: var(--surface-2); color: var(--ink); font-weight: 500; }
  .dimsline { font-size: .86rem; color: var(--muted); }
  .dimsline b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ---------- editable tables ---------- */
  .tscroll { overflow-x: auto; }
  table.grid { border-collapse: collapse; width: 100%; font-size: .86rem; }
  .grid th { font-weight: 500; font-size: .74rem; color: var(--muted); text-align: right; padding: 6px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
  .grid td { padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .grid td.c-num { white-space: nowrap; font-variant-numeric: tabular-nums; padding-top: 10px; }
  .grid tr.sel > td { background: color-mix(in srgb, var(--oak) 9%, transparent); }
  .grid tfoot td { border-bottom: 0; font-weight: 600; padding-top: 8px; }
  .cell { width: 100%; min-width: 0; border: 1px solid transparent; background: var(--sunk); border-radius: 4px; padding: 4px 6px; height: 30px; font-size: .86rem; }
  .cell:hover { border-color: var(--line-2); }
  .cell:focus { border-color: var(--oak); outline: none; background: var(--surface); }
  select.cell { padding-block: 0; cursor: pointer; }
  .cell.ltr { direction: ltr; text-align: left; }
  .w-code { width: 46px; text-align: center !important; }
  .w-name { min-width: 140px; }
  .w-n { width: 62px; }
  .w-d { width: 82px; }
  .w-prof { width: 158px; }
  .w-money { width: 86px; }
  @media (max-width: 560px) { .grid td { padding: 4px 3px; } .w-name { min-width: 112px; } .w-n { width: 52px; } .w-d { width: 72px; } .w-money { width: 66px; } .grid .pill { display: none; } }
  .expr { display: flex; flex-direction: column; gap: 1px; }
  .ev { font-size: .7rem; color: var(--faint); font-variant-numeric: tabular-nums; line-height: 1.3; }
  .expr .ev { direction: ltr; text-align: left; }
  .expr.bad .cell { border-color: var(--bad); background: var(--bad-bg); }
  .expr.bad .ev, .ev.bad { color: var(--bad); }
  .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(0, 0, 0, .22); flex: none; }
  .codecell { display: flex; align-items: center; gap: 5px; }
  .rowbtns { display: flex; gap: 1px; justify-content: flex-end; }
  .place-row > td { background: var(--surface-2); }
  .place { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: flex-end; padding: 6px 2px; }
  .place fieldset { border: 0; padding: 0; margin: 0; display: flex; gap: 6px; align-items: flex-end; flex-wrap: wrap; }
  .place legend { font-size: .72rem; color: var(--muted); padding: 0; margin-bottom: 3px; }
  .f { display: flex; flex-direction: column; gap: 2px; font-size: .72rem; color: var(--muted); }
  .place .cell { width: 82px; background: var(--surface); }
  .place select.cell { width: 170px; }
  .check { display: inline-flex; align-items: center; gap: 6px; font-size: .86rem; cursor: pointer; }
  .vars { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .78rem; color: var(--muted); margin-top: 10px; }
  .var { direction: ltr; unicode-bidi: isolate; background: var(--surface-2); border-radius: 4px; padding: 1px 6px; color: var(--ink); font-variant-numeric: tabular-nums; }
  details.adv > summary { cursor: pointer; font-weight: 500; font-size: .92rem; list-style: none; display: flex; align-items: center; gap: 8px; }
  details.adv > summary::-webkit-details-marker { display: none; }

  function parseCutList(text, takenCodes) {
    var out = [], skipped = 0, codes = {}, taken = new Set(takenCodes || []);
    function freeCode() { for (var c = 65; c < 91; c++) { var k = String.fromCharCode(c); if (!taken.has(k)) return k; } return 'Z'; }

      var cq = rest.match(/(?:^|[^A-Za-z])([A-Za-z]{1,2})\s*-\s*(\d+)/);

      else {
        var q = rest.match(/(?:^|\s)(\d+)\s*(?:יח(?:׳|'|ידות)?|x|×)?(?=\s|$|[|,;])/);

      var name = rest.replace(/[|,;:\t]+/g, ' ').replace(/\s+/g, ' ').trim() || 'חלק';
      var dimKey = d.join('x');

      <div class="vars"><span>פרמטרים לנוסחאות:</span>

  function ParamEditor(props) {
    var item = props.item, E = props.E;
    function set(p, k) { return function (e) { p[k] = e.target.value; commit('current'); }; }
    function setNum(p, k) { return function (e) { p[k] = num(e.target.value); commit('current'); }; }
    function optsText(p) { return (p.options || []).map(function (o) { return o.label != null && String(o.label) !== String(o.v) ? o.v + ':' + o.label : String(o.v); }).join(', '); }
    function setOpts(p, s) {
      p.options = s.split(/[,،]/).map(function (x) { var m = x.split(':'); return m[0].trim() === '' ? null : { v: num(m[0]), label: (m[1] != null ? m.slice(1).join(':') : m[0]).trim() }; }).filter(Boolean);
      if (p.options.length && !p.options.some(function (o) { return o.v === num(p.value); })) p.value = p.options[0].v;

    }
    return html`<details class="panel adv">
      <summary>עריכת פרמטרים (מתקדם)</summary>
      <p class="sub" style="margin-block:8px 12px">פרמטרים הם הסליידרים והבחירות שבצד, והערכים שהנוסחאות בטבלה משתמשות בהם. "קבוע" לא מוצג ללקוח, ו"מחושב" נקבע לפי נוסחה.</p>
      <div class="tscroll"><table class="grid">
        <thead><tr><th>מפתח</th><th>שם</th><th>סוג</th><th>מינימום</th><th>מקסימום</th><th>קפיצה</th><th>ערך או נוסחה</th><th>אפשרויות (ערך:תווית)</th><th></th></tr></thead>
        <tbody>${item.params.map(function (p, i) {
          var bad = !KEY_RE.test(p.key || '');
          return html`<tr key=${i}>
            <td><div class=${'expr' + (bad ? ' bad' : '')}><input class="cell ltr w-n" dir="ltr" value=${p.key} aria-label="מפתח" onInput=${set(p, 'key')}/>${bad ? html`<span class="ev">אותיות באנגלית בלבד</span>` : null}</div></td>
            <td><input class="cell w-name" value=${p.label} aria-label="שם" onInput=${set(p, 'label')}/></td>
            <td><select class="cell" value=${p.type} aria-label="סוג" onChange=${function (e) { p.type = e.target.value; if (p.type === 'range') { p.min = p.min != null ? p.min : 0; p.max = p.max != null ? p.max : 100; p.step = p.step || 1; p.unit = p.unit != null ? p.unit : CM; } if (p.type === 'choice' && !(p.options || []).length) p.options = [{ v: num(p.value), label: String(num(p.value)) }]; if (p.type === 'calc' && p.expr == null) p.expr = String(num(p.value)); commit('current'); }}>
              <option value="range">סליידר</option><option value="choice">בחירה</option><option value="const">קבוע</option><option value="calc">מחושב</option>
            </select></td>
            <td>${p.type === 'range' ? html`<input class="cell w-n" inputmode="decimal" value=${p.min} aria-label="מינימום" onChange=${setNum(p, 'min')}/>` : null}</td>
            <td>${p.type === 'range' ? html`<input class="cell w-n" inputmode="decimal" value=${p.max} aria-label="מקסימום" onChange=${setNum(p, 'max')}/>` : null}</td>
            <td>${p.type === 'range' ? html`<input class="cell w-n" inputmode="decimal" value=${p.step} aria-label="קפיצה" onChange=${setNum(p, 'step')}/>` : null}</td>
            <td>${p.type === 'calc' ? html`<${Expr} v=${p.expr} val=${E.vars[p.key]} err=${E.paramErr[p.key]} on=${function (v) { p.expr = v; commit('current'); }} label="נוסחה"/>`
              : html`<input class="cell w-n" inputmode="decimal" value=${p.value} aria-label="ערך" onChange=${setNum(p, 'value')}/>`}</td>
            <td>${p.type === 'choice' ? html`<input class="cell" style="min-width:150px" value=${optsText(p)} aria-label="אפשרויות" onChange=${function (e) { setOpts(p, e.target.value); }}/>` : null}</td>
            <td><button type="button" class="ibtn del" aria-label="מחיקת פרמטר" onClick=${function () { item.params.splice(i, 1); commit('current'); }}>${Ico.trash()}</button></td>
          </tr>`;
        })}</tbody>
      </table></div>
      <div class="actions" style="margin-top:10px">
        <button type="button" class="btn sm" onClick=${function () {
          var k = 'P' + (item.params.length + 1);
          item.params.push({ key: k, label: 'פרמטר חדש', type: 'range', min: 0, max: 100, step: 1, value: 50, unit: CM }); commit('current');
        }}>+ פרמטר</button>

          ${PREV[item.id] ? html`<button type="button" class="btn sm" onClick=${function () { var pv = PREV[item.id]; delete PREV[item.id]; item.params = pv.params; item.parts = pv.parts; commit('current'); toast('השינוי בוטל'); }}>ביטול השינוי האחרון</button>` : null}
          <button type="button" class="btn sm" onClick=${function () { fileRef.current && fileRef.current.click(); }}>${item.photo ? 'החלפת תמונה' : 'צירוף תמונה'}</button>
          <input type="file" accept="image/*" hidden ref=${fileRef} onChange=${onPhoto}/>
          <button type="button" class="btn sm" onClick=${function () { duplicateItem(item); }}>שכפול</button>
          <button type="button" class="btn sm" onClick=${function () { saveAsTemplate(item); }}>שמירה כתבנית</button>
          ${canSaveFiles() ? html`<button type="button" class="btn sm" onClick=${function () { saveFile((item.name || 'מוצר') + '.json', JSON.stringify(templateFromItem(item), null, 2), 'application/json'); }}>ייצוא מוצר</button>` : null}
          <button type="button" class="btn sm danger" onClick=${function () { removeItem(item); }}>מחיקה</button>
        </div>
      </section>
      <${Viewer3D} item=${item} E=${E}/>
    </div>`;
  }

  function TemplateCards(props) {

          ${thumb ? html`<img class="thumb" src=${thumb} alt=""/>` : html`<div class="thumb blank">${t.id === 'blank' ? 'רשימת חיתוכים בלבד' : 'ללא שרטוט'}</div>`}

      })}

            ${SAMPLE ? html`<button type="button" class="btn primary" onClick=${function () { openModal({ type: 'ai', mode: 'create' }); }}>שרטוט מתמונה עם Claude</button>` : null}</div>
          <${TemplateCards} onPick=${function (t) { addItemFromTemplate(t); }}/>
        </section>`}
    `;

  function WoodTab(props) {

            <button type="button" class="btn sm" onClick=${function () { pr.profiles.push({ id: uid('pr'), t: '', w: '', len: '400', price: '', note: '' }); commit('prices'); }}>+ קורה</button></div>
          ${anySample ? html`<p class="note" style="margin-bottom:8px"><span class="pill">דוגמה</span> מחירים לדוגמה בלבד. מחיר שתעדכנו יאבד את התווית.</p>` : null}

                <td><button type="button" class="ibtn del" aria-label="מחיקת קורה" onClick=${function () { pr.profiles = pr.profiles.filter(function (x) { return x !== p; }); commit('prices'); }}>${Ico.trash()}</button></td>
              </tr>`;

        </section>
        <section class="panel">

              <span><b>לפי קורות שלמות</b><br/><span class="note">משלמים על כל קורה שצריך לקנות לפי תכנית החיתוך.</span></span></label>
          </div>
          <div class="fields" style="margin-top:14px">
            ${pr.mode !== 'beams' ? html`<label class="field">פחת (%)<input inputmode="decimal" value=${pr.waste} onInput=${function (e) { pr.waste = e.target.value; commit('prices'); }}/></label>` : null}
            <label class="field">עובי מסור (${CM})<input inputmode="decimal" value=${pr.kerf} onInput=${function (e) { pr.kerf = e.target.value; commit('prices'); }}/></label>

  function CutPlan(props) {
    var r = props.r, beams = r.pack.beams, shown = beams.slice(0, 30), pr = S.prices;
    var legend = [];
    r.pieces.forEach(function (p) {
      var k = p.code + '|' + fmtDim(p.len), x = legend.find(function (z) { return z.k === k; });
      if (!x) { x = { k: k, p: p, n: 0, names: [] }; legend.push(x); }
      x.n += p.count;
      if (p.name && x.names.indexOf(p.name) < 0) x.names.push(p.name);
    });
    return html`<div class="plan">
      <div class="plan-head">
        <h4><span class="ltr">${sec(r.t, r.w)}</span> <span class="plan-meta">· קורה ${fmtDim(r.stock)} ${CM} · ${r.noPrice ? 'אין מחיר' : money(r.price, true)}${r.prof.note ? ' · ' + r.prof.note : ''}</span>${r.sample ? html` <span class="pill">מחיר לדוגמה</span>` : null}</h4>
        <span class="plan-meta">${beams.length} ${beams.length === 1 ? 'קורה' : 'קורות'} · ניצול ${Math.round(r.util * 100)}% · ${fmtDim(r.totalLen / 100)} מ׳ חיתוך</span>
      </div>
      <div class="legend">${legend.map(function (x) { return html`<span><span class="sw" style=${'background:' + x.p.color}></span><b>${x.p.code}</b> ${x.names.join(' + ')} · ${fmtDim(x.p.len)} ${CM} × ${x.n}</span>`; })}</div>
      <div class="beams">${shown.map(function (b, i) {
        return html`<div key=${i} class="beam" title=${'קורה ' + (i + 1)}>
          ${b.pieces.map(function (pc) { return html`<div class="piece" style=${'flex:0 0 ' + (pc.len / r.stock * 100) + '%;background:' + pc.color + ';color:' + textOn(pc.color)} title=${pc.code + ' ' + pc.name + ' · ' + fmtDim(pc.len)}>${pc.code} ${fmtDim(pc.len)}</div>`; })}
          <div class="beam-rest">${b.free > 2 ? 'שארית ' + fmtDim(b.free) : ''}</div>
        </div>`;
      })}</div>
      ${beams.length > shown.length ? html`<p class="note">ועוד ${beams.length - shown.length} קורות</p>` : null}
      ${r.pack.tooLong.length ? html`<div class="warnbox">חלקים ארוכים מהקורה (${fmtDim(r.stock - num(pr.trim))} ${CM} שמישים): ${r.pack.tooLong.map(function (p) { return p.code + ' ' + p.name + ' ' + fmtDim(p.len); }).join(', ')}. הגדילו את אורך הקורה במחירון או חלקו את החלק.</div>` : null}
      <div class="costline"><span>לפי מטר + פחת: <b>${money(r.costMeters)}</b></span><span>קורות שלמות: <b>${money(r.costBeams)}</b></span><span>במחיר ההצעה: <b>${money(r.cost)}</b></span></div>
    </div>`;
  }

  function RowsTable(props) {
    return html`<div class="tscroll"><table class="grid"><thead><tr>${props.head.map(function (h) { return html`<th>${h}</th>`; })}</tr></thead><tbody>${props.children}</tbody>${props.foot || null}</table></div>`;
  }

  function ItemCosts(props) {
    var item = props.item, P = props.P, rateDef = num(S.settings.rate);
    function setM(m, k) { return function (e) { m[k] = e.target.value; if (k === 'price') delete m.sample; commit('current'); }; }
    var matU = item.materials.reduce(function (a, m) { return a + num(m.qty) * num(m.price); }, 0);
    var labU = item.labor.reduce(function (a, l) { return a + num(l.hours) * (isBlank(l.rate) ? rateDef : num(l.rate)); }, 0);
    var hU = item.labor.reduce(function (a, l) { return a + num(l.hours); }, 0);
    return html`<section class="panel">
      <div class="panel-head"><h3 class="h-sec">${item.name || 'מוצר'} <span class="mut">× ${P.Q}</span></h3>
        <span class="note">עלות ליחידה <b class="num">${money(P.directUnit)}</b> · מחיר ליחידה <b class="num">${money(P.unit)}</b></span></div>
      <div class="cost-top"><span>עץ לפי המחירון</span><span><b>${money(P.Q ? P.wood / P.Q : 0)}</b> ליחידה · ${money(P.wood)} סה״כ</span></div>
      <h4 class="h-min">חומרים נוספים <span class="mut">(ליחידה)</span></h4>
      <${RowsTable} head=${['פריט', 'כמות', 'מחיר ליחידה (₪)', 'סה״כ', '']}
        foot=${item.materials.length ? html`<tfoot><tr><td>סה״כ ליחידה</td><td></td><td></td><td class="c-num">${money(matU, true)}</td><td></td></tr></tfoot>` : null}>
        ${item.materials.map(function (m) {
          return html`<tr key=${m.id}>
            <td><input class="cell w-name" value=${m.name} placeholder="למשל: ברגים, דבק, לכה" aria-label="פריט" onInput=${setM(m, 'name')}/></td>
            <td><input class="cell w-n" inputmode="decimal" value=${m.qty} aria-label="כמות" onInput=${setM(m, 'qty')}/></td>
            <td><div class="gap" style="flex-wrap:nowrap"><input class="cell w-money" inputmode="decimal" value=${m.price} aria-label="מחיר ליחידה" onInput=${setM(m, 'price')}/>${m.sample ? html`<span class="pill">דוגמה</span>` : null}</div></td>
            <td class="c-num">${money(num(m.qty) * num(m.price), true)}</td>
            <td><button type="button" class="ibtn del" aria-label="מחיקה" onClick=${function () { item.materials = item.materials.filter(function (x) { return x !== m; }); commit('current'); }}>${Ico.trash()}</button></td>
          </tr>`;
        })}
      <//>
      <button type="button" class="btn sm" style="margin-top:8px" onClick=${function () { item.materials.push({ id: uid('m'), name: '', qty: '1', price: '' }); commit('current'); }}>+ חומר</button>
      <h4 class="h-min">שעות עבודה <span class="mut">(ליחידה)</span></h4>
      <${RowsTable} head=${['שלב', 'שעות', '₪ לשעה', 'סה״כ', '']}
        foot=${item.labor.length ? html`<tfoot><tr><td>סה״כ ליחידה</td><td class="c-num">${fmtHours(hU)}</td><td></td><td class="c-num">${money(labU, true)}</td><td></td></tr></tfoot>` : null}>
        ${item.labor.map(function (l) {
          var rate = isBlank(l.rate) ? rateDef : num(l.rate);
          return html`<tr key=${l.id}>
            <td><input class="cell w-name" value=${l.name} placeholder="למשל: חיתוך, הרכבה, צביעה" aria-label="שלב" onInput=${setM(l, 'name')}/></td>
            <td><input class="cell w-n" inputmode="decimal" value=${l.hours} aria-label="שעות" onInput=${setM(l, 'hours')}/></td>
            <td><input class="cell w-money" inputmode="decimal" value=${l.rate} placeholder=${String(rateDef)} aria-label="תעריף לשעה" onInput=${setM(l, 'rate')}/></td>
            <td class="c-num">${money(num(l.hours) * rate, true)}</td>
            <td><button type="button" class="ibtn del" aria-label="מחיקה" onClick=${function () { item.labor = item.labor.filter(function (x) { return x !== l; }); commit('current'); }}>${Ico.trash()}</button></td>
          </tr>`;
        })}
      <//>
      <button type="button" class="btn sm" style="margin-top:8px" onClick=${function () { item.labor.push({ id: uid('l'), name: '', hours: '1', rate: '' }); commit('current'); }}>+ שורת עבודה</button>
    </section>`;
  }

  function PricingPanel() {
    var q = S.quote, pr = q.pricing;
    function set(k, g) { return function (e) { pr[k] = e.target.value; commit(g || 'current'); }; }
    return html`<section class="panel">
      <h3 class="h-sec" style="margin-bottom:12px">רווח ותוספות</h3>
      <div class="field"><span>רווח</span>
        <div class="row" style="justify-content:flex-start">
          <span class="pctbox"><input class="cell" inputmode="decimal" value=${pr.profit} aria-label="אחוז רווח" onInput=${set('profit')}/>%</span>
          <span class="seg" role="group" aria-label="איך מחושב הרווח">
            <button type="button" class=${pr.profitMode !== 'margin' ? 'on' : ''} onClick=${function () { pr.profitMode = 'markup'; commit('current'); }}>על העלות</button>
            <button type="button" class=${pr.profitMode === 'margin' ? 'on' : ''} onClick=${function () { pr.profitMode = 'margin'; commit('current'); }}>מתוך המחיר</button>
          </span>
        </div>
        <span class="hint">${pr.profitMode === 'margin' ? 'הרווח הוא אחוז ממחיר המכירה (לפני מע״מ). 30% מתוך המחיר = עלות ÷ 0.7.' : 'הרווח מתווסף כאחוז על העלות הישירה. 30% על העלות = עלות × 1.3.'}</span>
      </div>
      <div class="field" style="margin-top:14px"><span>תוספות באחוזים</span>
        ${(pr.extras || []).map(function (x) {
          return html`<div key=${x.id} class="xrow">
            <input class="cell" value=${x.label} aria-label="שם התוספת" onInput=${function (e) { x.label = e.target.value; commit('current'); }}/>
            <span class="pctbox"><input class="cell" inputmode="decimal" value=${x.pct} aria-label="אחוז" onInput=${function (e) { x.pct = e.target.value; commit('current'); }}/>%</span>
            <button type="button" class="ibtn del" aria-label="מחיקה" onClick=${function () { pr.extras = pr.extras.filter(function (z) { return z !== x; }); commit('current'); }}>${Ico.trash()}</button>
          </div>`;
        })}
        <button type="button" class="linkbtn" style="align-self:flex-start" onClick=${function () { pr.extras = pr.extras || []; pr.extras.push({ id: uid('x'), label: 'תוספת', pct: '0' }); commit('current'); }}>+ תוספת באחוזים</button>
        <span class="hint">מחושבות על המחיר אחרי הרווח, ונכללות במחיר ליחידה. אפשר לשנות את השם, למשל מס הכנסה, תקורה או עמלה.</span>
      </div>
      <div class="fields" style="margin-top:14px">
        <label class="field">עיגול מחיר ליחידה
          <select value=${String(pr.round)} onChange=${set('round')}>
            <option value="0">ללא עיגול</option><option value="1">לשקל</option><option value="5">ל-5 ₪</option><option value="10">ל-10 ₪</option><option value="50">ל-50 ₪</option><option value="100">ל-100 ₪</option>
          </select></label>
        <label class="field">הנחה ללקוח (%)<input inputmode="decimal" value=${pr.discount} onInput=${set('discount')}/></label>
        <label class="field">תעריף שעת עבודה (₪)<input inputmode="decimal" value=${S.settings.rate} onInput=${function (e) { S.settings.rate = e.target.value; commit('settings'); }}/></label>
      </div>
      <div class="row" style="margin-top:14px;justify-content:flex-start">
        <label class="check"><input type="checkbox" checked=${!!pr.vatOn} onChange=${function (e) { pr.vatOn = e.target.checked; commit('current'); }}/> להוסיף מע״מ</label>
        ${pr.vatOn ? html`<span class="pctbox"><input class="cell" inputmode="decimal" value=${pr.vat} aria-label="אחוז מע״מ" onInput=${set('vat')}/>%</span>` : null}
      </div>
    </section>`;
  }

  function Summary(props) {
    var P = props.C.pricing, q = S.quote;
    function R(label, v, cls) { return html`<div class=${'sum-row ' + (cls || '')}><span>${label}</span><span class="v">${v}</span></div>`; }
    return html`<section class="panel sum">
      <h3 class="h-sec" style="margin-bottom:8px">סיכום ההצעה</h3>
      ${R('עץ', money(P.wood), 'sub')}
      ${R('חומרים נוספים', money(P.mat), 'sub')}
      ${R('עבודה · ' + fmtHours(P.hours) + ' שעות', money(P.labor), 'sub')}
      ${R('עלות ישירה', money(P.direct), 'strong')}
      ${R('רווח ' + fmtDim(num(q.pricing.profit)) + '% ' + (q.pricing.profitMode === 'margin' ? 'מתוך המחיר' : 'על העלות'), money(P.profit))}
      ${(q.pricing.extras || []).filter(function (x) { return num(x.pct); }).length ? R('תוספות באחוזים', money(P.extraAmt)) : null}
      ${Math.abs(P.rounding) >= 0.5 ? R('עיגול מחירים', money(P.rounding)) : null}
      ${P.fixed ? R('תוספות קבועות', money(P.fixed)) : null}
      ${P.discount ? R('הנחה ' + fmtDim(num(q.pricing.discount)) + '%', money(-P.discount)) : null}
      ${R('סה״כ לפני מע״מ', money(P.beforeVat), 'strong')}
      ${q.pricing.vatOn ? R('מע״מ ' + fmtDim(num(q.pricing.vat)) + '%', money(P.vat), 'sub') : null}
      ${R('סה״כ ללקוח', money(P.total), 'total')}
      <div class="okbox" style="margin-top:10px">רווח בפועל <b class="num">${money(P.realProfit)}</b> (${Math.round(P.marginPct * 100)}% מהמחיר לפני מע״מ), אחרי תשלום על ${fmtHours(P.hours)} שעות עבודה.</div>
    </section>`;
  }

  function CostsTab(props) {
    var C = props.C, q = S.quote;
    return html`<div class="costs">
      <div class="stack">
        ${q.items.length ? q.items.map(function (it) { return html`<${ItemCosts} key=${it.id} item=${it} P=${C.pricing.byId[it.id]}/>`; }) : html`<section class="panel"><p class="note">אין עדיין מוצרים בהצעה. הוסיפו מוצר בלשונית "תכנון ושרטוט".</p></section>`}
        <section class="panel">
          <h3 class="h-sec">תוספות קבועות להצעה</h3>
          <p class="sub" style="margin-bottom:10px">סכומים שנכנסים להצעה כמו שהם, בלי אחוז רווח. למשל הובלה או התקנה.</p>
          ${(q.extras || []).map(function (x) {
            return html`<div key=${x.id} class="xrow" style="margin-bottom:6px">
              <input class="cell" value=${x.name} placeholder="למשל: הובלה" aria-label="שם" onInput=${function (e) { x.name = e.target.value; commit('current'); }}/>
              <span class="pctbox"><input class="cell w-money" inputmode="decimal" value=${x.amount} aria-label="סכום" onInput=${function (e) { x.amount = e.target.value; commit('current'); }}/>₪</span>
              <button type="button" class="ibtn del" aria-label="מחיקה" onClick=${function () { q.extras = q.extras.filter(function (z) { return z !== x; }); commit('current'); }}>${Ico.trash()}</button>
            </div>`;
          })}
          <button type="button" class="btn sm" onClick=${function () { q.extras = q.extras || []; q.extras.push({ id: uid('e'), name: '', amount: '' }); commit('current'); }}>+ תוספת קבועה</button>
        </section>
        ${q.items.length ? html`<section class="panel">
          <h3 class="h-sec" style="margin-bottom:10px">מחיר לכל מוצר</h3>
          <${RowsTable} head=${['מוצר', 'כמות', 'עלות ליח׳', 'מחיר ליח׳', 'סה״כ', 'רווח']}>
            ${C.pricing.items.map(function (p) { return html`<tr key=${p.id}><td>${p.name}</td><td class="c-num">${p.Q}</td><td class="c-num">${money(p.directUnit)}</td><td class="c-num"><b>${money(p.unit)}</b></td><td class="c-num">${money(p.line)}</td><td class="c-num">${money(p.profit + p.rounding)}</td></tr>`; })}
          <//>
        </section>` : null}
      </div>
      <div class="stack side">
        <${PricingPanel}/>
        <${Summary} C=${C}/>
      </div>
    </div>`;
  }

  function DocActions(props) {
    return html`<div class="doc-actions">
      ${!IN_VIEWER ? html`<button type="button" class="btn primary" onClick=${function () { printDoc(props.doc()); }}>הדפסה או PDF</button>` : null}
      ${canSaveFiles() ? html`<button type="button" class=${'btn' + (IN_VIEWER ? ' primary' : '')} onClick=${function () { saveFile(props.name + '.html', docFile(props.name, props.doc()), 'text/html'); }}>הורדה כקובץ להדפסה</button>` : null}
      ${canSaveFiles() ? html`<button type="button" class="btn" onClick=${function () { exportPNG(props.doc(), props.name + '.png'); }}>שמירה כתמונה</button>` : null}
      ${props.text ? html`<button type="button" class="btn" onClick=${function () { copyText(props.text()); }}>העתקת טקסט לוואטסאפ</button>` : null}
    </div>`;
  }

  function QuoteTab(props) {
    var C = props.C, q = S.quote, cu = q.customer, b = S.settings.biz;
    function setC(k) { return function (e) { cu[k] = e.target.value; commit('current'); }; }
    function setB(k) { return function (e) { b[k] = e.target.value; commit('settings'); }; }
    var doc = quoteDocHTML(C);
    return html`<div class="qt">
      <div class="stack">
        <section class="panel">
          <h3 class="h-sec" style="margin-bottom:10px">פרטי הלקוח</h3>
          <div class="fields">
            <label class="field">שם<input value=${cu.name} onInput=${setC('name')}/></label>
            <label class="field">טלפון<input type="tel" inputmode="tel" value=${cu.phone} onInput=${setC('phone')}/></label>
            <label class="field">אימייל<input type="email" value=${cu.email} onInput=${setC('email')}/></label>
            <label class="field">כתובת<input value=${cu.address} onInput=${setC('address')}/></label>
          </div>
        </section>
        <section class="panel">
          <h3 class="h-sec" style="margin-bottom:10px">פרטי ההצעה</h3>
          <div class="fields">
            <label class="field">מספר הצעה<input inputmode="numeric" value=${q.no} onInput=${function (e) { q.no = e.target.value; commit('current'); }}/></label>
            <label class="field">תאריך<input type="date" value=${q.date} onInput=${function (e) { q.date = e.target.value; commit('current'); }}/></label>
            <label class="field">תוקף (ימים)<input inputmode="numeric" value=${q.validDays} onInput=${function (e) { q.validDays = e.target.value; commit('current'); }}/></label>
          </div>
          <label class="field" style="margin-top:10px">הנדון<input value=${q.title} onInput=${function (e) { q.title = e.target.value; commit('current'); }}/></label>
          ${q.items.map(function (it) {
            return html`<div key=${it.id} class="item-q">
              <b>${it.name}</b>
              <div class="fields">
                <label class="field">תמונה בהצעה
                  <select value=${it.img === 'photo' && !it.photo ? 'render' : it.img} onChange=${function (e) { it.img = e.target.value; commit('current'); }}>
                    <option value="render">השרטוט</option>${it.photo ? html`<option value="photo">התמונה שצירפתם</option>` : null}<option value="none">בלי תמונה</option>
                  </select></label>
                <label class="field">תיאור קצר<input value=${it.note} placeholder="למשל: עץ אורן, גימור שמן טבעי" onInput=${function (e) { it.note = e.target.value; commit('current'); }}/></label>
              </div>
            </div>`;
          })}
          <label class="field" style="margin-top:12px">הערות ותנאים<textarea value=${q.terms} onInput=${function (e) { q.terms = e.target.value; commit('current'); }}></textarea></label>
          <button type="button" class="linkbtn" style="margin-top:6px" onClick=${function () { S.settings.terms = q.terms; commit('settings'); toast('התנאים יופיעו בכל הצעה חדשה'); }}>להשתמש בתנאים האלה בכל הצעה חדשה</button>
        </section>
        <details class="panel adv">
          <summary>פרטי העסק בראש ההצעה</summary>
          <div class="fields" style="margin-top:12px">
            <label class="field">שם העסק<input value=${b.name} onInput=${setB('name')}/></label>
            <label class="field">שורת תיאור<input value=${b.line} onInput=${setB('line')}/></label>
            <label class="field">טלפון<input type="tel" value=${b.phone} onInput=${setB('phone')}/></label>
            <label class="field">אימייל<input type="email" value=${b.email} onInput=${setB('email')}/></label>
            <label class="field">כתובת<input value=${b.address} onInput=${setB('address')}/></label>
            <label class="field">ע.מ. / ח.פ.<input value=${b.taxId} onInput=${setB('taxId')}/></label>
          </div>
        </details>
      </div>
      <div class="docwrap">
        <${DocActions} name=${'הצעת מחיר ' + q.no} doc=${function () { return quoteDocHTML(computeFor(S.quote)); }} text=${function () { return quoteText(computeFor(S.quote)); }}/>
        <div dangerouslySetInnerHTML=${{ __html: doc }}></div>
      </div>
    </div>`;
  }

  function ShopTab(props) {
    var C = props.C, doc = shopDocHTML(C);
    return html`<div class="stack">
      <section class="panel"><h3 class="h-sec">דף עבודה לנגרייה</h3><p class="sub">רשימת חיתוכים לכל מוצר, שרטוט עם מידות, קורות לקנייה ותכנית חיתוך. בלי מחירים, כדי שאפשר לתלות ליד שולחן העבודה.</p></section>
      <div class="docwrap">
        <${DocActions} name=${'דף עבודה ' + S.quote.no} doc=${function () { return shopDocHTML(computeFor(S.quote)); }}/>
        <div dangerouslySetInnerHTML=${{ __html: doc }}></div>
      </div>
    </div>`;
  }

  function PriceBar(props) {
    var P = props.C.pricing, W = props.C.wood, q = S.quote;
    var warn = W.missingN > 0 ? W.missingN + ' חלקים בלי מחיר עץ' : (W.tooLong > 0 ? 'יש חלקים ארוכים מהקורה' : '');
    return html`<div class="pricebar"><div class="wrap pb">
      <div class="pb-total"><span class="k">סה״כ ללקוח</span><span class="v">${money(P.total)}</span><span class="k">${q.pricing.vatOn ? 'כולל מע״מ' : 'ללא מע״מ'}</span></div>
      <div class="pb-meta">
        <span>עלות <b>${money(P.direct)}</b></span>
        <span>רווח <b>${money(P.realProfit)}</b></span>
        <span class="opt">עץ <b>${money(P.wood)}</b></span>
        <span class="opt"><b>${fmtHours(P.hours)}</b> שעות</span>
        ${warn ? html`<span class="pb-warn">${warn}</span>` : null}
      </div>
      ${S.ui.tab !== 'quote' ? html`<button type="button" class="btn" onClick=${function () { setTab('quote'); }}>להצעה ללקוח</button>` : html`<button type="button" class="btn" onClick=${function () { setTab('costs'); }}>לעלויות ורווח</button>`}
    </div></div>`;
  }

  /* ---------- dialogs ---------- */
  function Modal(props) {
    useEffect(function () {
      function onKey(e) { if (e.key === 'Escape') closeModal(); }
      document.addEventListener('keydown', onKey);
      return function () { document.removeEventListener('keydown', onKey); };
    }, []);
    return html`<div class="overlay" onClick=${function (e) { if (e.target === e.currentTarget && !props.sticky) closeModal(); }}>
      <div class=${'modal' + (props.wide ? ' wide' : '')} role="dialog" aria-modal="true" aria-label=${props.title}>
        <div class="modal-head"><h3>${props.title}</h3><button type="button" class="ibtn" aria-label="סגירה" onClick=${closeModal}>${Ico.close()}</button></div>
        ${props.children}
      </div>
    </div>`;
  }
  function ConfirmModal(props) {
    var m = props.m;
    return html`<${Modal} title=${m.title}>
      <p>${m.text}</p>
      <div class="modal-foot">
        <button type="button" class=${'btn ' + (m.danger ? 'danger' : 'primary')} onClick=${function () { var f = m.onOk; closeModal(); if (f) f(); }}>${m.ok || 'אישור'}</button>
        <button type="button" class="btn ghost" onClick=${closeModal}>ביטול</button>
      </div>
    <//>`;
  }
  function PickerModal() {
    var st = useState(''), txt = st[0], setTxt = st[1];
    var er = useState(''), err = er[0], setErr = er[1];
    var fileRef = useRef(null);
    function tryImport(obj) { try { importProductJSON(obj && obj.kind === 'nagriya-quotes' ? null : obj); } catch (e) { setErr('לא הצלחתי לקרוא את המוצר. ודאו שזה קובץ מוצר מהמחשבון.'); } }
    return html`<${Modal} title="הוספת מוצר להצעה" wide=${true}>
      ${SAMPLE ? html`<div class="banner" style="background:var(--surface-2);border-color:var(--line)"><span>יש לכם תמונה של רהיט? Claude ישרטט מודל דומה מקורות ולוחות.</span><button type="button" class="btn sm primary" onClick=${function () { openModal({ type: 'ai', mode: 'create' }); }}>שרטוט מתמונה</button></div>` : null}
      <${TemplateCards} onPick=${function (t) { addItemFromTemplate(t); closeModal(); }}/>
      <details class="adv">
        <summary>ייבוא מוצר מקובץ או מטקסט</summary>
        <p class="sub" style="margin-block:8px">מוצר שיוצא מהמחשבון, או מודל שקיבלתם מ-Claude בצ׳אט. הדביקו את הטקסט או בחרו קובץ JSON.</p>
        <textarea class="copybox" style="min-height:120px" dir="ltr" value=${txt} onInput=${function (e) { setTxt(e.target.value); setErr(''); }} placeholder='{"name": "...", "params": [...], "parts": [...]}'></textarea>
        ${err ? html`<p class="bad-t" style="font-size:.86rem">${err}</p>` : null}
        <div class="actions" style="margin-top:8px">
          <button type="button" class="btn sm primary" disabled=${!txt.trim()} onClick=${function () { var o; try { o = JSON.parse(txt.trim().replace(/^```(json)?|```$/g, '')); } catch (e) { setErr('הטקסט אינו JSON תקין.'); return; } tryImport(o); }}>ייבוא מהטקסט</button>
          <button type="button" class="btn sm" onClick=${function () { fileRef.current && fileRef.current.click(); }}>בחירת קובץ</button>
          <input type="file" accept=".json,application/json" hidden ref=${fileRef} onChange=${function (e) { var f = e.target.files[0]; e.target.value = ''; if (f) readJSONFile(f).then(tryImport, function () { setErr('הקובץ אינו JSON תקין.'); }); }}/>
        </div>
      </details>
    <//>`;
  }
  function PasteModal(props) {
    var item = S.quote.items.find(function (i) { return i.id === props.m.itemId; });
    var st = useState(''), txt = st[0], setTxt = st[1];
    if (!item) return null;
    var parsed = parseCutList(txt, item.parts.map(function (p) { return String(p.code || '').toUpperCase(); }));
    return html`<${Modal} title="הדבקת רשימת חיתוכים">
      <p class="sub">שורה לכל חלק: כמות, שם ומידות בס״מ בסדר עובי × רוחב × אורך. אפשר להעתיק ישר מדף העבודה.</p>
      <textarea class="copybox" value=${txt} onInput=${function (e) { setTxt(e.target.value); }} placeholder=${'2-A רגל ספסל 5X15X35\n5-B מושב + משענת 2X10X50\n2-C תומכי משענת 5X10X48'}></textarea>
      ${txt.trim() ? html`<p class="note">${parsed.parts.length ? 'זוהו ' + parsed.parts.length + ' חלקים: ' + parsed.parts.map(function (p) { return p.n + '× ' + p.name + ' ' + lri(p.t + '×' + p.w + '×' + p.l); }).join(' · ') : 'לא זוהו חלקים עדיין.'}${parsed.skipped ? ' · ' + (parsed.skipped === 1 ? 'שורה אחת בלי מידות דולגה' : parsed.skipped + ' שורות בלי מידות דולגו') : ''}</p>` : null}
      <p class="hint">החלקים ייכנסו לחישוב העץ מיד. כדי שיופיעו בשרטוט, מגדירים להם מיקום בכפתור ${Ico.move()} שבטבלה${SAMPLE ? ', או מבקשים מ-Claude לסדר אותם' : ''}.</p>
      <div class="modal-foot">
        <button type="button" class="btn primary" disabled=${!parsed.parts.length} onClick=${function () { item.parts = item.parts.concat(parsed.parts); commit('current'); closeModal(); toast('נוספו ' + parsed.parts.length + ' חלקים'); }}>הוספה לרשימה</button>
        <button type="button" class="btn ghost" onClick=${closeModal}>ביטול</button>
      </div>
    <//>`;
  }
  function AIModal(props) {
    var m = props.m, modify = m.mode === 'modify';
    var item = modify ? S.quote.items.find(function (i) { return i.id === m.itemId; }) : null;
    var fs = useState([]), files = fs[0], setFiles = fs[1];
    var ts = useState([]), thumbs = ts[0], setThumbs = ts[1];
    var ns = useState(''), notes = ns[0], setNotes = ns[1];
    var bs = useState(false), busy = bs[0], setBusy = bs[1];
    var es = useState(''), err = es[0], setErr = es[1];
    var ss = useState(0), secs = ss[0], setSecs = ss[1];
    var ctl = useRef(null), fileRef = useRef(null);
    useEffect(function () {
      if (!busy) return;
      var t0 = Date.now(), iv = setInterval(function () { setSecs(Math.round((Date.now() - t0) / 1000)); }, 1000);
      return function () { clearInterval(iv); };
    }, [busy]);
    useEffect(function () { return function () { if (ctl.current) ctl.current.abort(); }; }, []);
    function pick(e) {
      var list = Array.from(e.target.files || []).slice(0, SAMPLE_MAXIMG);
      e.target.value = '';
      setFiles(list);
      Promise.all(list.map(function (f) { return fileToDataURL(f, 600, 0.75).catch(function () { return null; }); })).then(function (d) { setThumbs(d.filter(Boolean)); });
    }
    function run() {
      if (!SAMPLE) return;
      setErr(''); setBusy(true); setSecs(0);
      var c = new AbortController(); ctl.current = c;
      var imgs = files.slice();
      if (modify && !imgs.length && item && item.photo) { var d = getImage(item.photo); var bl = d && dataURLtoBlob(d); if (bl) imgs.push(bl); }
      var useImgs = SAMPLE_IMAGES && imgs.length > 0;
      var prompt = buildAIPrompt(modify ? 'modify' : 'create', notes.trim(), item, useImgs);
      var opts = { modelTier: 'complex', signal: c.signal, cache: false };
      if (useImgs) opts.images = imgs.slice(0, SAMPLE_MAXIMG);
      var call = typeof SAMPLE.json === 'function' ? SAMPLE.json(prompt, opts) : SAMPLE(prompt, opts).then(function (r) { var t = r.text, a = t.indexOf('{'), b = t.lastIndexOf('}'); return JSON.parse(t.slice(a, b + 1)); });
      call.then(function (out) {
        var t = normalizeTemplate(out);
        if (modify && item) {
          PREV[item.id] = { params: clone(item.params), parts: clone(item.parts) };
          item.params = t.params;
          item.parts = t.parts;
          if (!item.materials.length && t.materials.length) item.materials = t.materials.map(function (x) { return Object.assign({ id: uid('m') }, x); });
          S.ui.selPart = null; S.ui.photo = false;
          commit('current', 'ui'); closeModal(); toast('השרטוט עודכן. אפשר לבטל בכפתור "ביטול השינוי האחרון".');
        } else {
          var first = files[0];
          var finish = function (photoId) {
            t.photo = photoId || null;
            var it = addItemFromTemplate(t);
            if (photoId) it.img = 'render';
            S.ui.photo = false; closeModal(); toast('השרטוט מוכן. כוונו מידות בסליידרים ובטבלה.');
          };
          if (first) fileToDataURL(first).then(function (d) { finish(putImage(d)); }, function () { finish(null); });
          else finish(null);
        }
      }, function (e) {
        setBusy(false);
        var code = e && e.code;
        if (code === 'cancelled') return;
        if (code === 'not_granted' || code === 'sampling_disabled' || code === 'not_declared' || code === 'capability_disabled' || code === 'capability_removed') { SAMPLE = null; }
        setErr(AI_ERRORS[code] || (e && e.message === 'empty' ? 'Claude לא החזיר חלקים. נסו תמונה ברורה יותר או הוסיפו תיאור.' : 'משהו השתבש בדרך. נסו שוב.'));
      });
    }
    var canRun = modify ? !!notes.trim() : (files.length > 0 || !!notes.trim());
    return html`<${Modal} title=${modify ? 'שינוי השרטוט עם Claude' : 'שרטוט מתמונה עם Claude'} sticky=${busy}>
      <p class="sub">${modify ? 'כתבו מה לשנות. Claude יעדכן את הפרמטרים ואת רשימת החלקים, ואת התוצאה אפשר לכוונן או לבטל.' : 'העלו תמונה של הרהיט, ואם יש גם רשימת חיתוכים או מידות. Claude ישרטט מודל דומה מקורות ולוחות, עם סליידרים לשינוי המידות.'}</p>
      ${SAMPLE_IMAGES ? html`<div class="field"><span>${modify ? 'תמונה (לא חובה)' : 'תמונות של הרהיט (עד ' + SAMPLE_MAXIMG + ')'}</span>
        <div class="gap"><button type="button" class="btn sm" disabled=${busy} onClick=${function () { fileRef.current && fileRef.current.click(); }}>${files.length ? 'החלפת תמונות' : 'בחירת תמונות'}</button>
          <input type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden ref=${fileRef} onChange=${pick}/>
          ${modify && item && item.photo && !files.length ? html`<span class="hint">התמונה שצורפה למוצר תישלח</span>` : null}</div>
        ${thumbs.length ? html`<div class="thumbs">${thumbs.map(function (s, i) { return html`<img key=${i} src=${s} alt=""/>`; })}</div>` : null}
      </div>` : html`<p class="note">אי אפשר לשלוח תמונות מכאן, אבל אפשר לתאר את הרהיט במילים.</p>`}
      <label class="field">${modify ? 'מה לשנות?' : 'תיאור, מידות או רשימת חיתוכים (לא חובה)'}
        <textarea value=${notes} disabled=${busy} onInput=${function (e) { setNotes(e.target.value); }} placeholder=${modify ? 'למשל: להוסיף מדף תחתון, להגביה את המשענת ל-55, להחליף את הרגליים לקורות 7×7' : 'למשל: ספסל לגן ילדים באורך 120 וגובה ישיבה 30. או רשימה: 2 רגל 5x15x35'}></textarea></label>
      ${err ? html`<div class="warnbox">${err}</div>` : null}
      ${busy ? html`<div class="progress"><span class="spinner" aria-hidden="true"></span><span>Claude משרטט… ${secs} שניות. זה יכול לקחת עד דקה או שתיים.</span></div>` : null}
      <div class="modal-foot">
        ${busy ? html`<button type="button" class="btn" onClick=${function () { if (ctl.current) ctl.current.abort(); setBusy(false); }}>עצירה</button>`
          : html`<button type="button" class="btn primary" disabled=${!canRun} onClick=${run}>${modify ? 'עדכון השרטוט' : 'שרטוט'}</button>`}
        <button type="button" class="btn ghost" onClick=${function () { if (ctl.current) ctl.current.abort(); closeModal(); }}>סגירה</button>
      </div>
    <//>`;
  }
  function SavedModal() {
    var list = S.saved.slice().sort(function (a, b) { return num(b.updatedAt) - num(a.updatedAt); });
    return html`<${Modal} title="הצעות שמורות">
      ${S.quote ? html`<div class="banner" style="background:var(--surface-2);border-color:var(--line)"><span>פתוחה עכשיו: הצעה מס׳ ${S.quote.no}${S.quote.title ? ' · ' + S.quote.title : ''}</span><button type="button" class="btn sm" onClick=${function () { saveCurrent(); }}>שמירה ברשימה</button></div>` : null}
      ${list.length ? html`<div>${list.map(function (q) {
        var d = q.updatedAt ? new Date(q.updatedAt) : null;
        return html`<div key=${q.id} class="listrow">
          <div><div class="t">מס׳ ${q.no} · ${q.title || 'ללא שם'}</div>
            <div class="m">${q.customer && q.customer.name ? q.customer.name + ' · ' : ''}${q.items.length} מוצרים · ${money(q.summary ? q.summary.total : 0)}${d ? ' · עודכנה ' + d.toLocaleDateString('he-IL') : ''}</div></div>
          <div class="actions">
            <button type="button" class="btn sm primary" onClick=${function () { openSaved(q.id); }}>פתיחה</button>
            <button type="button" class="btn sm" onClick=${function () { duplicateSaved(q.id); }}>שכפול</button>
            <button type="button" class="btn sm danger" onClick=${function () { deleteSaved(q.id); }}>מחיקה</button>
          </div>
        </div>`;
      })}</div>` : html`<p class="note">עוד לא נשמרו הצעות. לחצו "שמירה" בראש הדף כדי לשמור את ההצעה הפתוחה.</p>`}
    <//>`;
  }
  function BackupModal() {
    var fileRef = useRef(null);
    var si = syncInfo();
    return html`<${Modal} title="גיבוי ושחזור">
      <p class="sub">${Cloud.state === 'synced' ? 'הנתונים מסונכרנים לחשבון Claude שלכם, ונשמרים גם במכשיר הזה.' : (si[1] + '. כדאי להוריד גיבוי מדי פעם, או כדי להעביר את המחירון והצעות למכשיר אחר.')}</p>
      <div class="actions">
        ${canSaveFiles() ? html`<button type="button" class="btn primary" onClick=${exportBackup}>הורדת גיבוי מלא</button>` : null}
        <button type="button" class="btn" onClick=${function () { fileRef.current && fileRef.current.click(); }}>שחזור מקובץ גיבוי</button>
        <input type="file" accept=".json,application/json" hidden ref=${fileRef} onChange=${function (e) {
          var f = e.target.files[0]; e.target.value = '';
          if (!f) return;
          readJSONFile(f).then(function (d) {
            if (!d || d.app !== 'nagriya-quotes') { toast('זה לא קובץ גיבוי של המחשבון'); return; }
            confirmBox('לשחזר מהגיבוי?', 'המחירון, ההצעה הפתוחה, ההצעות השמורות והתבניות יוחלפו בנתונים מהקובץ.', 'שחזור', function () { importBackup(d); }, false);
          }, function () { toast('לא הצלחתי לקרוא את הקובץ'); });
        }}/>
      </div>
      <div class="listrow" style="border-bottom:0">
        <span class="note">להתחיל מחדש עם הדוגמה של פינת הזולה ומחירי הדוגמה.</span>
        <button type="button" class="btn sm danger" onClick=${function () {
          confirmBox('לאפס לנתוני הדוגמה?', 'המחירון וההצעה הפתוחה יחזרו לדוגמה. הצעות שמורות ותבניות נשארות.', 'איפוס', function () {
            S.prices = seedPrices(); S.quote = sampleQuote(); S.ui.sel = null; S.ui.hideSample = false;
            commit('prices', 'current', 'ui');
          });
        }}>איפוס</button>
      </div>
    <//>`;
  }
  function TextModal(props) {
    var ref = useRef(null);
    useEffect(function () { if (ref.current) { ref.current.focus(); ref.current.select(); } }, []);
    return html`<${Modal} title="העתקת הטקסט">
      <p class="sub">הטקסט מסומן. העתיקו אותו (Ctrl+C או לחיצה ארוכה) והדביקו בוואטסאפ או במייל.</p>
      <textarea ref=${ref} class="copybox" readonly value=${props.m.text}></textarea>
    <//>`;
  }
  function ModalHost() {
    var m = S.ui.modal;
    if (!m) return null;
    switch (m.type) {
      case 'confirm': return html`<${ConfirmModal} m=${m}/>`;
      case 'picker': return html`<${PickerModal}/>`;
      case 'paste': return html`<${PasteModal} m=${m}/>`;
      case 'ai': return SAMPLE ? html`<${AIModal} key=${m.mode + (m.itemId || '')} m=${m}/>` : null;
      case 'saved': return html`<${SavedModal}/>`;
      case 'backup': return html`<${BackupModal}/>`;
      case 'text': return html`<${TextModal} m=${m}/>`;
      default: return null;
    }
  }

  function App() {
    var st = useState(0), setT = st[1];
    FORCE = function () { setT(function (x) { return x + 1; }); };
    var C = computeFor(S.quote);
    var tab = S.ui.tab;
    return html`<div>
      <${Header} C=${C}/>
      <main class="wrap main">
        ${tab === 'design' ? html`<${DesignTab} C=${C}/>` : null}
        ${tab === 'wood' ? html`<${WoodTab} C=${C}/>` : null}
        ${tab === 'costs' ? html`<${CostsTab} C=${C}/>` : null}
        ${tab === 'quote' ? html`<${QuoteTab} C=${C}/>` : null}
        ${tab === 'shop' ? html`<${ShopTab} C=${C}/>` : null}
      </main>
      <${PriceBar} C=${C}/>
      <${ModalHost}/>
      ${S.ui.toast ? html`<div class="toast" role="status">${S.ui.toast}</div>` : null}
    </div>`;
  }

  appEl.innerHTML = '';
  render(html`<${App}/>`, appEl);
  cloudInit();
  capsInit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { snapCache.clear(); FORCE(); });
})();
</script>
</body>
</html>
