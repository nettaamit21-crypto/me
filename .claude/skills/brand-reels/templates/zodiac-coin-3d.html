<script>
const $=id=>document.getElementById(id);
// local (clip in at 7.15): Aries 0.15, Taurus 2.15, Gemini 4.70, Cancer 7.87, Leo 10.02, Virgo 12.73, Libra 14.97,
// Sagittarius 17.31, Capricorn 20.79, Aquarius 23.33, Pisces 26.49, Scorpio 30.09; out on "If you saw yourself" 38.2
const G=['♈','♉','♊','♋','♌','♍','♎','♐','♑','♒','♓','♏'];
const T=[0.15,2.15,4.70,7.87,10.02,12.73,14.97,17.31,20.79,23.33,26.49,30.09], OUT=38.2;
const ang=M.track(-90,[[T[0],0,[11,0.78]],...T.slice(1).map((t,i)=>[t-0.05,180*(i+1),[13,0.8]])]);
const pop=M.track(0,[[T[0],1,[12,0.72]],[OUT,0,[16,0.9]]]);
M.scene({W:420,H:420,bg:null,T:38.6,intro:null,center:[210,200],
  SH:{s:{w:2,h:2,r:1,bg:'#000000',cam:1}},start:'s',SEQ:[],
  geom:(t,g)=>{g.op=0;return g;},
  extra:(t)=>{
    const a=ang(t), k=Math.max(0,Math.floor((a+90)/180)), idx=Math.min(G.length-1,k), last=idx==G.length-1;
    const s=Math.max(0,pop(t)), bob=4*Math.sin(t*1.6);
    $('sc').style.opacity=M.clamp(s*1.4).toFixed(3);
    $('sc').style.transform=`translate(-50%,calc(-50% + ${bob.toFixed(2)}px)) scale(${(0.35+0.65*s).toFixed(4)})`;
    $('coin').style.transform=`rotateY(${a.toFixed(2)}deg)`;
    const unmirror=(k%2)?'translateZ(-14px) scaleX(-1)':'translateZ(0px)';
    $('fg').style.display=last?'none':''; $('fi').style.display=last?'':'none';
    $('fg').style.transform=unmirror; $('fi').style.transform=unmirror;
    if(!last) M.setText($('g1'),G[idx]);
    const ti=T[idx], sw=M.clamp((t-ti-0.35)/0.7), x=(-60+180*M.eio(sw)).toFixed(1)+'%';
    $('s1').style.left=x; $('s2').style.left=x; $('s1').style.opacity=$('s2').style.opacity=(sw>0&&sw<1)?1:0;
    const edge=Math.abs(Math.cos(a*Math.PI/180)); $('sh').style.width=(80+120*edge).toFixed(1)+'px';
  }});
</script>
